richiedono eccellenza."},"Rossopuro é uma linha profissional de equipamentos de cardio de alto padrão, 100% fabricada na Itália.":{"en":"Rossopuro is a high-end professional line of cardio equipment, 100% manufactured in Italy.","it":"Rossopuro è una linea professionale di attrezzature cardio di alto livello, prodotta al 100% in Italia."},"Rossopuro é uma linha profissional de equipamentos de cardio fitness de alto padrão, 100% fabricada na Itália.":{"en":"Rossopuro is a high-end professional line of cardio fitness equipment, 100% manufactured in Italy.","it":"Rossopuro è una linea professionale di attrezzature cardio fitness di alto livello, prodotta al 100% in Italia."},"Rossopuro não é apenas uma linha de equipamentos de cardio fitness; é uma experiência de treino interativa, personalizada e envolvente. Cada máquina é projetada com atenção meticulosa aos detalhes, combinando design elegante com recursos avançados para se adequar perfeitamente às necessidades de cada usuário.\nAs máquinas Rossopuro Touch contam com tecnologias inovadoras, como monitoramento avançado de desempenho e um guia de postura que orienta o usuário durante o exercício.\nA tela Touch Console de 21 polegadas oferece uma interface intuitiva, altamente responsiva e de alta luminosidade, garantindo total controle das funções e leitura clara dos dados do treino. A missão da Rossopuro é transformar a rotina de treinos com equipamentos cardio de última geração, acessíveis a todos os níveis — de iniciantes a atletas profissionais.":{"en":"Rossopuro is not just a line of cardio fitness equipment; it is an interactive, personalized and engaging training experience. Each machine is designed with meticulous attention to detail, combining elegant design with advanced features to suit each user's needs perfectly.\nRossopuro Touch machines feature innovative technologies, such as advanced performance monitoring and a posture guide that directs the user during exercise.\nThe 21-inch Touch Console screen offers an intuitive, highly responsive and bright interface, ensuring full control of functions and clear reading of workout data. Rossopuro's mission is to transform training routines with state-of-the-art cardio equipment, accessible to all levels — from beginners to professional athletes.","it":"Rossopuro non è solo una linea di attrezzature cardio fitness; è un'esperienza di allenamento interattiva, personalizzata e coinvolgente. Ogni macchina è progettata con un'attenzione meticolosa ai dettagli, unendo un design elegante a funzioni avanzate per adattarsi perfettamente alle esigenze di ogni utente.\nLe macchine Rossopuro Touch dispongono di tecnologie innovative, come il monitoraggio avanzato delle prestazioni e una guida alla postura che orienta l'utente durante l'esercizio.\nLo schermo Touch Console da 21 pollici offre un'interfaccia intuitiva, altamente reattiva e luminosa, garantendo il pieno controllo delle funzioni e una lettura chiara dei dati dell'allenamento. La missione di Rossopuro è trasformare la routine di allenamento con attrezzature cardio di ultima generazione, accessibili a tutti i livelli — dai principianti agli atleti professionisti."},"Amplo display HD de 21,5” com vidro temperado de 4mm e moldura elegante em alumínio acetinado, equipado com carregamento sem fio para seus dispositivos. Conta com webcam integrada e sensor óptico para garantir total envolvimento do usuário e segurança durante o uso.":{"en":"Large 21.5” HD display with 4 mm tempered glass and an elegant satin aluminum frame, equipped with wireless charging for your devices. It features an integrated webcam and optical sensor to ensure full user engagement and safety during use.","it":"Ampio display HD da 21,5” con vetro temperato da 4 mm ed elegante cornice in alluminio satinato, dotato di ricarica wireless per i tuoi dispositivi. Dispone di webcam integrata e sensore ottico per garantire il pieno coinvolgimento dell'utente e la sicurezza durante l'uso."},"CONSOLE COM DISPLAY HD DE 21,5”":{"en":"CONSOLE WITH 21.5” HD DISPLAY","it":"CONSOLE CON DISPLAY HD DA 21,5”"},"O Activity Pilot, novo assistente virtual, orienta a execução correta dos exercícios e previne situações de risco. Além disso, identifica se a máquina foi deixada em movimento e interrompe a esteira automaticamente em segundos, garantindo mais segurança.":{"en":"Activity Pilot, the new virtual assistant, guides the correct execution of exercises and prevents risky situations. It also detects whether the machine has been left running and automatically stops the treadmill within seconds, ensuring greater safety.","it":"Activity Pilot, il nuovo assistente virtuale, guida la corretta esecuzione degli esercizi e previene situazioni di rischio. Inoltre, rileva se la macchina è stata lasciata in movimento e arresta automaticamente il tappeto in pochi secondi, garantendo maggiore sicurezza."},"NOVO ASSISTENTE DE TREINO":{"en":"NEW TRAINING ASSISTANT","it":"NUOVO ASSISTENTE DI ALLENAMENTO"},"Sistema multimídia avançado com novas funcionalidades para TV, rádio, redes sociais e serviços de streaming. A gestão personalizada de favoritos proporciona uma experiência imersiva e individualizada para cada usuário.":{"en":"Advanced multimedia system with new features for TV, radio, social networks and streaming services. Personalized management of favorites provides an immersive, individual experience for each user.","it":"Sistema multimediale avanzato con nuove funzionalità per TV, radio, social network e servizi di streaming. La gestione personalizzata dei preferiti offre un'esperienza immersiva e individuale a ogni utente."},"MULTIMÍDIA":{"en":"MULTIMEDIA","it":"MULTIMEDIA"},"Máxima funcionalidade enriquecida por um amplo compartimento de objetos, que oferece uma solução confortável para todas as necessidades.":{"en":"Maximum functionality enhanced by a large object compartment, offering a comfortable solution for every need.","it":"Massima funzionalità arricchita da un ampio vano portaoggetti, che offre una soluzione comoda per ogni esigenza."},"FUNCIONALIDADE":{"en":"FUNCTIONALITY","it":"FUNZIONALITÀ"},"Ampla biblioteca de treinos focados em objetivos, com opções livres e guiadas. Inclui também os novos percursos de Treinamento Virtual, gerenciados dinamicamente pela própria máquina para uma experiência mais envolvente e eficaz.":{"en":"A wide library of goal-focused workouts, with free and guided options. It also includes the new Virtual Training routes, managed dynamically by the machine itself for a more engaging and effective experience.","it":"Ampia libreria di allenamenti mirati agli obiettivi, con opzioni libere e guidate. Include anche i nuovi percorsi di Allenamento Virtuale, gestiti dinamicamente dalla macchina stessa per un'esperienza più coinvolgente ed efficace."},"TREINOS PROFISSIONAIS":{"en":"PROFESSIONAL WORKOUTS","it":"ALLENAMENTI PROFESSIONALI"},"Descubra a experiência Rossopuro Touch: tecnologia, design e performance em um só treino.":{"en":"Discover the Rossopuro Touch experience: technology, design and performance in a single workout.","it":"Scopri l'esperienza Rossopuro Touch: tecnologia, design e prestazioni in un solo allenamento."},"A Panatta é protagonista na nova tendência de treinos em grupo: o WALKING. Com esteira de resistência mecânica, estável, compacta e de design moderno, permite reproduzir o movimento natural da caminhada de forma fluida e segura, unindo inovação e experiência.":{"en":"Panatta is a protagonist in the new group training trend: WALKING. With a mechanical-resistance treadmill that is stable, compact and modern in design, it reproduces the natural walking movement in a fluid and safe way, combining innovation and experience.","it":"Panatta è protagonista della nuova tendenza degli allenamenti di gruppo: il WALKING. Con un tappeto a resistenza meccanica, stabile, compatto e dal design moderno, permette di riprodurre il movimento naturale della camminata in modo fluido e sicuro, unendo innovazione ed esperienza."},"Race Walker Panatta: diversão com eficiência!":{"en":"Race Walker Panatta: fun with efficiency!","it":"Race Walker Panatta: divertimento ed efficienza!"},"A Panatta é referência na nova tendência de treinos em grupo: o WALKING. A esteira de resistência mecânica, compacta, estável e com design moderno, foi desenvolvida para reproduzir o movimento natural da caminhada de forma fluida e segura.":{"en":"Panatta is a benchmark in the new group training trend: WALKING. The mechanical-resistance treadmill, compact, stable and modern in design, was developed to reproduce the natural walking movement in a fluid and safe way.","it":"Panatta è un riferimento nella nuova tendenza degli allenamenti di gruppo: il WALKING. Il tappeto a resistenza meccanica, compatto, stabile e dal design moderno, è stato sviluppato per riprodurre il movimento naturale della camminata in modo fluido e sicuro."},"Inovadora e eficaz para treinos indoor":{"en":"Innovative and effective for indoor training","it":"Innovativo ed efficace per l'allenamento indoor"},"Ideal para todos os públicos: adolescentes, adultos de 20 a 50 anos e terceira idade":{"en":"Ideal for all audiences: teenagers, adults aged 20 to 50 and seniors","it":"Ideale per tutti: adolescenti, adulti dai 20 ai 50 anni e terza età"},"Treinamento divertido e motivador, com música, variações de posição e o acompanhamento do instrutor":{"en":"Fun and motivating training, with music, position variations and instructor guidance","it":"Allenamento divertente e motivante, con musica, variazioni di posizione e l'accompagnamento dell'istruttore"},"Aulas direcionadas conforme o perfil e objetivo dos alunos":{"en":"Classes tailored to the students' profile and goals","it":"Lezioni mirate in base al profilo e all'obiettivo degli allievi"},"Não exige sala específica — pode ser integrada facilmente a diversos espaços":{"en":"No dedicated room required — it can be easily integrated into different spaces","it":"Non richiede una sala dedicata — può essere integrato facilmente in diversi spazi"},"Race Walker é a melhor forma de caminhar dentro da academia com prazer, segurança e resultados reais!":{"en":"Race Walker is the best way to walk inside the gym with pleasure, safety and real results!","it":"Race Walker è il modo migliore per camminare in palestra con piacere, sicurezza e risultati reali!"},"A esteira pode ser facilmente fechada com um sistema de travamento por cinta de segurança, permitindo o manuseio pela alça lateral. Quando fechada, pode ser posicionada encostada totalmente à parede, otimizando o espaço do ambiente.":{"en":"The treadmill can be easily folded with a safety strap locking system and moved using the side handle. When folded, it can be placed flat against the wall, optimizing the space.","it":"Il tappeto può essere chiuso facilmente con un sistema di bloccaggio a cinghia di sicurezza e spostato con la maniglia laterale. Una volta chiuso, può essere posizionato completamente contro la parete, ottimizzando lo spazio."},"OTIMIZAÇÃO DE ESPAÇO":{"en":"SPACE OPTIMIZATION","it":"OTTIMIZZAZIONE DELLO SPAZIO"},"Controle lateral de fácil acesso para ajuste da resistência. Também é possível bloquear completamente a prancha da esteira, garantindo segurança e versatilidade no uso.":{"en":"Easy-to-reach side control for adjusting resistance. The treadmill deck can also be fully locked, ensuring safety and versatility of use.","it":"Comando laterale di facile accesso per regolare la resistenza. È anche possibile bloccare completamente la pedana del tappeto, garantendo sicurezza e versatilità d'uso."},"RESISTÊNCIA":{"en":"RESISTANCE","it":"RESISTENZA"},"3 níveis de ajuste, permitindo variações de intensidade no treino.":{"en":"3 adjustment levels, allowing variations in training intensity.","it":"3 livelli di regolazione, che permettono variazioni di intensità nell'allenamento."},"INCLINAÇÃO":{"en":"INCLINE","it":"INCLINAZIONE"},"Sempre à mão e prontos para uso, oferecendo mais praticidade durante o treino.":{"en":"Always at hand and ready to use, offering more convenience during training.","it":"Sempre a portata di mano e pronti all'uso, per una maggiore praticità durante l'allenamento."},"SUPORTE PARA GARRAFA E CELULAR":{"en":"BOTTLE AND PHONE HOLDER","it":"PORTABORRACCIA E PORTA CELLULARE"},"Alça larga que permite diversas posições de treino, oferecendo mais conforto e versatilidade nos movimentos.":{"en":"Wide handle that allows several training positions, offering more comfort and versatility of movement.","it":"Maniglia larga che consente diverse posizioni di allenamento, offrendo più comfort e versatilità nei movimenti."},"ALÇA AMPLA":{"en":"WIDE HANDLE","it":"MANIGLIA AMPIA"},"Garante máxima fluidez e suavidade nos movimentos, proporcionando uma experiência de treino mais natural e eficiente.":{"en":"Ensures maximum fluidity and smoothness of movement, providing a more natural and efficient training experience.","it":"Garantisce la massima fluidità e scorrevolezza dei movimenti, offrendo un'esperienza di allenamento più naturale ed efficiente."},"DUPLO VOLANTE DE INÉRCIA":{"en":"DOUBLE INERTIA FLYWHEEL","it":"DOPPIO VOLANO D'INERZIA"},"Projetada para oferecer máxima segurança durante o uso, garantindo estabilidade e desempenho ideal.":{"en":"Designed to offer maximum safety during use, ensuring stability and ideal performance.","it":"Progettata per offrire la massima sicurezza durante l'uso, garantendo stabilità e prestazioni ideali."},"RELAÇÃO ENTRE A PRANCHA E A CORREIA":{"en":"RELATIONSHIP BETWEEN DECK AND BELT","it":"RAPPORTO TRA PEDANA E NASTRO"},"A linha de cardio Fenix Touch une tecnologia de ponta e design moderno, com fabricação 100% italiana. Oferece configurações inteligentes e profissionais, além dos melhores recursos de entretenimento: TV, plataformas de streaming, redes sociais e navegação na internet. Tudo isso com o melhor custo-benefício do mercado, para uma experiência de treino completa e conectada.":{"en":"The Fenix Touch cardio line combines cutting-edge technology and modern design, with 100% Italian manufacturing. It offers smart, professional settings, as well as the best entertainment features: TV, streaming platforms, social networks and web browsing. All with the best value for money on the market, for a complete and connected training experience.","it":"La linea cardio Fenix Touch unisce tecnologia d'avanguardia e design moderno, con produzione 100% italiana. Offre impostazioni intelligenti e professionali, oltre alle migliori funzioni di intrattenimento: TV, piattaforme di streaming, social network e navigazione internet. Il tutto con il miglior rapporto qualità-prezzo del mercato, per un'esperienza di allenamento completa e connessa."},"A Panatta completa sua linha de Cardio Fitness com um novo console de tela multi-touch.":{"en":"Panatta completes its Cardio Fitness line with a new multi-touch screen console.","it":"Panatta completa la sua linea Cardio Fitness con una nuova console con schermo multi-touch."},"Fácil de usar e conectar, graças ao display LCD retroiluminado, oferece acesso intuitivo a programas, imagens e conteúdos altamente funcionais, garantindo uma experiência única de treino e navegação na web.\nHardware e software 100% Made in Italy.":{"en":"Easy to use and connect, thanks to the backlit LCD display, it offers intuitive access to highly functional programs, images and content, ensuring a unique training and web browsing experience.\nHardware and software 100% Made in Italy.","it":"Facile da usare e da connettere grazie al display LCD retroilluminato, offre un accesso intuitivo a programmi, immagini e contenuti altamente funzionali, garantendo un'esperienza unica di allenamento e navigazione web.\nHardware e software 100% Made in Italy."},"Sistema de Lubrificação Inteligente":{"en":"Smart Lubrication System","it":"Sistema di Lubrificazione Intelligente"},"Para as linhas de cardio, a Panatta escolheu materiais do universo automotivo e introduziu um sistema de lubrificação automática que gera uma economia média de até R$ 6.000,00 nos dois primeiros anos de manutenção dos equipamentos de corrida.\nEsqueça as esteiras impregnadas com cera, de vida útil limitada e necessidade constante de manutenção. Agora, o sistema é totalmente automatizado: lubrifica apenas quando necessário, mantendo a esteira eficiente e durável por muito mais tempo.\nVAMOS ECONOMIZAR O SEU DINHEIRO!":{"en":"For its cardio lines, Panatta chose materials from the automotive world and introduced an automatic lubrication system that generates average savings of up to R$ 6,000.00 in the first two years of maintenance of running equipment.\nForget treadmills impregnated with wax, with a limited lifespan and constant need for maintenance. Now the system is fully automated: it lubricates only when necessary, keeping the treadmill efficient and durable for much longer.\nLET'S SAVE YOUR MONEY!","it":"Per le linee cardio, Panatta ha scelto materiali del mondo automobilistico e ha introdotto un sistema di lubrificazione automatica che genera un risparmio medio fino a R$ 6.000,00 nei primi due anni di manutenzione delle attrezzature da corsa.\nDimentica i tapis roulant impregnati di cera, dalla vita utile limitata e con continua necessità di manutenzione. Ora il sistema è completamente automatizzato: lubrifica solo quando necessario, mantenendo il tappeto efficiente e durevole molto più a lungo.\nFACCIAMO RISPARMIARE I TUOI SOLDI!"},"O cardio fitness da Panatta é a combinação perfeita entre forma e tecnologia, beleza e funcionalidade. 100% Made in Italy. Máxima personalização.":{"en":"Panatta cardio fitness is the perfect combination of form and technology, beauty and functionality. 100% Made in Italy. Maximum customization.","it":"Il cardio fitness Panatta è la combinazione perfetta tra forma e tecnologia, bellezza e funzionalità. 100% Made in Italy. Massima personalizzazione."},"DESIGN E FABRICAÇÃO ITALIANA":{"en":"ITALIAN DESIGN AND MANUFACTURING","it":"DESIGN E PRODUZIONE ITALIANA"},"Programas de treino adequados para todos os tipos de usuários, desde iniciantes até atletas profissionais. Interface gráfica moderna, intuitiva e de fácil utilização.":{"en":"Training programs suitable for all types of users, from beginners to professional athletes. Modern, intuitive and easy-to-use graphic interface.","it":"Programmi di allenamento adatti a tutti i tipi di utenti, dai principianti agli atleti professionisti. Interfaccia grafica moderna, intuitiva e facile da usare."},"PROFISSIONAL E FÁCIL DE USAR":{"en":"PROFESSIONAL AND EASY TO USE","it":"PROFESSIONALE E FACILE DA USARE"},"Estruturas feitas em aço liga ou alumínio, com espessura de 3 a 10 mm. Máximo desempenho e confiabilidade com total segurança.":{"en":"Frames made of alloy steel or aluminum, 3 to 10 mm thick. Maximum performance and reliability with total safety.","it":"Telai realizzati in acciaio legato o alluminio, con spessore da 3 a 10 mm. Massime prestazioni e affidabilità in totale sicurezza."},"SÓLIDO E CONFIÁVEL":{"en":"SOLID AND RELIABLE","it":"SOLIDO E AFFIDABILE"},"Máxima funcionalidade com um custo-benefício que só a Panatta pode oferecer.":{"en":"Maximum functionality with value for money that only Panatta can offer.","it":"Massima funzionalità con un rapporto qualità-prezzo che solo Panatta può offrire."},"A melhor relação custo-benefício":{"en":"The best value for money","it":"Il miglior rapporto qualità-prezzo"},"Interface gráfica amigável, moderna e fácil de usar, pensada para proporcionar uma navegação fluida e uma experiência de treino simples e eficiente":{"en":"Friendly, modern and easy-to-use graphic interface, designed to provide fluid navigation and a simple, efficient training experience","it":"Interfaccia grafica amichevole, moderna e facile da usare, pensata per offrire una navigazione fluida e un'esperienza di allenamento semplice ed efficiente"},"INTERFACE INTUITIVA":{"en":"INTUITIVE INTERFACE","it":"INTERFACCIA INTUITIVA"},"Configurações e ajustes realizados por meio de sistemas circulares de controle inovadores, que aproveitam ao máximo os recursos da tela sensível ao toque capacitiva, oferecendo uma experiência interativa e precisa.":{"en":"Settings and adjustments made through innovative circular control systems that make the most of the capacitive touch screen, offering an interactive and precise experience.","it":"Impostazioni e regolazioni effettuate tramite innovativi sistemi di controllo circolari, che sfruttano al massimo le funzioni dello schermo touch capacitivo, offrendo un'esperienza interattiva e precisa."},"Programas de treino desenvolvidos para todos os perfis de usuários, desde iniciantes até atletas profissionais de diversas modalidades esportivas.":{"en":"Training programs developed for all user profiles, from beginners to professional athletes of various sports.","it":"Programmi di allenamento sviluppati per tutti i profili di utenti, dai principianti agli atleti professionisti di diverse discipline sportive."},"PROFISSIONAL":{"en":"PROFESSIONAL","it":"PROFESSIONALE"},"Cenário de treino personalizável com uma seleção de imagens e vídeos, oferecendo uma experiência mais envolvente e motivadora durante os exercícios.":{"en":"Customizable training scenery with a selection of images and videos, offering a more engaging and motivating experience during exercise.","it":"Scenario di allenamento personalizzabile con una selezione di immagini e video, per un'esperienza più coinvolgente e motivante durante gli esercizi."},"VISUALIZAÇÃO VIRTUAL":{"en":"VIRTUAL VIEW","it":"VISUALIZZAZIONE VIRTUALE"},"O melhor do entretenimento durante o treino: acesso a conteúdos de TV, rádio, músicas e vídeos, tudo em um só lugar para uma experiência completa e dinâmica.":{"en":"The best entertainment during training: access to TV, radio, music and video content, all in one place for a complete and dynamic experience.","it":"Il meglio dell'intrattenimento durante l'allenamento: accesso a contenuti TV, radio, musica e video, tutto in un unico posto per un'esperienza completa e dinamica."},"Conexão rápida e prática com sites, rádios online e redes sociais, garantindo que você permaneça conectado mesmo durante os treinos.":{"en":"Fast and practical connection to websites, online radio and social networks, ensuring you stay connected even during workouts.","it":"Connessione rapida e pratica a siti web, radio online e social network, per restare connesso anche durante l'allenamento."},"CONECTIVIDADE":{"en":"CONNECTIVITY","it":"CONNETTIVITÀ"},"Um projeto pensado para o sucesso do seu negócio: área de controle, personalização e compartilhamento de dados técnicos em tempo real, tudo para otimizar a gestão e o desempenho dos equipamentos.":{"en":"A project designed for the success of your business: control area, customization and real-time sharing of technical data, all to optimize equipment management and performance.","it":"Un progetto pensato per il successo della tua attività: area di controllo, personalizzazione e condivisione dei dati tecnici in tempo reale, il tutto per ottimizzare la gestione e le prestazioni delle attrezzature."},"GESTÃO INTELIGENTE DE EQUIPAMENTOS":{"en":"SMART EQUIPMENT MANAGEMENT","it":"GESTIONE INTELLIGENTE DELLE ATTREZZATURE"},"A Panatta oferece a oportunidade de personalizar seus equipamentos, com diversas opções de cores para as estruturas, unindo estilo e identidade ao seu espaço fitness.":{"en":"Panatta offers the opportunity to personalize your equipment, with several color options for the frames, bringing style and identity to your fitness space.","it":"Panatta offre la possibilità di personalizzare le tue attrezzature, con diverse opzioni di colore per i telai, unendo stile e identità al tuo spazio fitness."},"Descubra agora e transforme sua experiência de treino!":{"en":"Discover it now and transform your training experience!","it":"Scoprila ora e trasforma la tua esperienza di allenamento!"},"Sem consumo de energia, com 7 níveis de resistência e 100% Made in Italy, a linha ECOLINE foi desenvolvida com foco na sustentabilidade e na inovação. São máquinas de cardio totalmente autossuficientes, versáteis e ideais até mesmo para espaços funcionais.\nTecnologia limpa e eficiente para um treino moderno e consciente.":{"en":"With no energy consumption, 7 resistance levels and 100% Made in Italy, the ECOLINE line was developed with a focus on sustainability and innovation. They are fully self-sufficient, versatile cardio machines, ideal even for functional spaces.\nClean and efficient technology for modern, conscious training.","it":"Senza consumo di energia, con 7 livelli di resistenza e 100% Made in Italy, la linea ECOLINE è stata sviluppata con un'attenzione particolare alla sostenibilità e all'innovazione. Sono macchine cardio completamente autosufficienti, versatili e ideali anche per gli spazi funzionali.\nTecnologia pulita ed efficiente per un allenamento moderno e consapevole."},"Na Panatta, \"green\" vai além da cor — é um compromisso com o futuro. A linha ECOLINE representa esse propósito, unindo tecnologia, desempenho e respeito ao meio ambiente com equipamentos 100% energy-free, duráveis e de baixa manutenção.\nSustentabilidade em movimento.":{"en":"At Panatta, \"green\" goes beyond color — it is a commitment to the future. The ECOLINE line represents this purpose, combining technology, performance and respect for the environment with 100% energy-free, durable, low-maintenance equipment.\nSustainability in motion.","it":"In Panatta, \"green\" va oltre il colore — è un impegno verso il futuro. La linea ECOLINE rappresenta questo scopo, unendo tecnologia, prestazioni e rispetto per l'ambiente con attrezzature 100% energy-free, durevoli e a bassa manutenzione.\nSostenibilità in movimento."},"Todos os equipamentos da linha ECOLINE contam com 7 anos de garantia nas estruturas, reforçando a confiança e a durabilidade da qualidade Panatta.":{"en":"All ECOLINE equipment comes with a 7-year warranty on the frames, reinforcing the trust and durability of Panatta quality.","it":"Tutte le attrezzature della linea ECOLINE hanno 7 anni di garanzia sui telai, a conferma della fiducia e della durata della qualità Panatta."},"GARANTIA":{"en":"WARRANTY","it":"GARANZIA"},"O corpo é o verdadeiro motor do seu treino! Cada pessoa pode ajustar a intensidade do exercício de acordo com seu nível de condicionamento, tornando a experiência mais personalizada e autêntica.":{"en":"The body is the true engine of your workout! Each person can adjust the exercise intensity according to their fitness level, making the experience more personalized and authentic.","it":"Il corpo è il vero motore del tuo allenamento! Ogni persona può regolare l'intensità dell'esercizio in base al proprio livello di preparazione, rendendo l'esperienza più personalizzata e autentica."},"SEM MOTOR":{"en":"NO MOTOR","it":"SENZA MOTORE"},"Os equipamentos da linha ECOLINE exigem mínima manutenção ao longo do tempo, garantindo praticidade e durabilidade para o seu espaço fitness.":{"en":"ECOLINE equipment requires minimal maintenance over time, ensuring practicality and durability for your fitness space.","it":"Le attrezzature della linea ECOLINE richiedono una manutenzione minima nel tempo, garantendo praticità e durata al tuo spazio fitness."},"BAIXA MANUTENÇÃO":{"en":"LOW MAINTENANCE","it":"BASSA MANUTENZIONE"},"Todos os equipamentos da linha ECOLINE são versáteis e multifuncionais, podendo ser usados como estações individuais ou integrados a áreas funcionais. Isso torna o treino cruzado ainda mais completo e estimula o treinamento em grupo.":{"en":"All ECOLINE equipment is versatile and multifunctional and can be used as individual stations or integrated into functional areas. This makes cross training even more complete and encourages group training.","it":"Tutte le attrezzature della linea ECOLINE sono versatili e multifunzionali e possono essere utilizzate come stazioni singole o integrate in aree funzionali. Questo rende il cross training ancora più completo e stimola l'allenamento di gruppo."},"EQUIPAMENTOS MULTIFUNCIONAIS":{"en":"MULTIFUNCTIONAL EQUIPMENT","it":"ATTREZZATURE MULTIFUNZIONALI"},"Descubra o cardio fitness que une luxo e performance.":{"en":"Discover the cardio fitness that combines luxury and performance.","it":"Scopri il cardio fitness che unisce lusso e prestazioni."},"A linha de cardio fitness que superou uma década de acirrada concorrência. A mais imitada!\nUm nome lendário no mundo dos carros esportivos — e símbolo de um estilo inconfundível reconhecido mundialmente — assina a nova linha de máquinas de cardio fitness da Panatta.\nUm novo conceito em cardio fitness que representa a união perfeita entre forma e tecnologia, beleza e funcionalidade.":{"en":"The cardio fitness line that has outlasted a decade of fierce competition. The most imitated!\nA legendary name in the world of sports cars — and a symbol of unmistakable, globally recognized style — signs Panatta's new line of cardio fitness machines.\nA new concept in cardio fitness that represents the perfect union of form and technology, beauty and functionality.","it":"La linea di cardio fitness che ha superato un decennio di agguerrita concorrenza. La più imitata!\nUn nome leggendario nel mondo delle auto sportive — e simbolo di uno stile inconfondibile riconosciuto in tutto il mondo — firma la nuova linea di macchine cardio fitness di Panatta.\nUn nuovo concetto di cardio fitness che rappresenta l'unione perfetta tra forma e tecnologia, bellezza e funzionalità."},"Pininfarina, um nome lendário para todos os entusiastas de carros esportivos e do conceito Made in Italy, decidiu colaborar com a Panatta na criação de uma linha de cardiofitness que supera toda a concorrência.":{"en":"Pininfarina, a legendary name for all sports car enthusiasts and for the Made in Italy concept, decided to collaborate with Panatta to create a cardio fitness line that surpasses all competition.","it":"Pininfarina, nome leggendario per tutti gli appassionati di auto sportive e del concetto di Made in Italy, ha deciso di collaborare con Panatta alla creazione di una linea di cardio fitness che supera tutta la concorrenza."},"Para a linha Pininfarina, a Panatta escolheu materiais do universo automotivo e introduziu um sistema de lubrificação automática que economiza até R$ 6.000,00 nos primeiros três anos de manutenção do equipamento.\nAlém disso, a linha conta com um software multimídia totalmente renovado, com um Editor de Perfil do Usuário que permite a criação de perfis de treino personalizados e infinitamente ajustáveis.\nGarantia de 10 anos / Projetado e Fabricado na Itália.":{"en":"For the Pininfarina line, Panatta chose materials from the automotive world and introduced an automatic lubrication system that saves up to R$ 6,000.00 in the first three years of equipment maintenance.\nIn addition, the line features completely renewed multimedia software, with a User Profile Editor that allows the creation of personalized and infinitely adjustable training profiles.\n10-year warranty / Designed and Manufactured in Italy.","it":"Per la linea Pininfarina, Panatta ha scelto materiali del mondo automobilistico e ha introdotto un sistema di lubrificazione automatica che fa risparmiare fino a R$ 6.000,00 nei primi tre anni di manutenzione dell'attrezzatura.\nInoltre, la linea dispone di un software multimediale completamente rinnovato, con un Editor del Profilo Utente che consente di creare profili di allenamento personalizzati e regolabili all'infinito.\nGaranzia di 10 anni / Progettato e Prodotto in Italia."},"O novo cardio fitness é a combinação perfeita entre forma e tecnologia, beleza e funcionalidade.\nDesign Pininfarina.":{"en":"The new cardio fitness is the perfect combination of form and technology, beauty and functionality.\nPininfarina Design.","it":"Il nuovo cardio fitness è la combinazione perfetta tra forma e tecnologia, bellezza e funzionalità.\nDesign Pininfarina."},"DESIGN PININFARINA":{"en":"PININFARINA DESIGN","it":"DESIGN PININFARINA"},"Estrutura externa em alumínio, elemento nobre, uma nova fusão entre elegância e propriedades mecânicas: é mais leve que o ferro tradicional e mais resistente à corrosão e ao suor.":{"en":"External aluminum frame, a noble element and a new fusion of elegance and mechanical properties: it is lighter than traditional iron and more resistant to corrosion and sweat.","it":"Struttura esterna in alluminio, elemento nobile, una nuova fusione tra eleganza e proprietà meccaniche: è più leggero del ferro tradizionale e più resistente alla corrosione e al sudore."},"ESTRUTURA EM ALUMÍNIO":{"en":"ALUMINUM FRAME","it":"STRUTTURA IN ALLUMINIO"},"Este instrumento inovador e dinâmico guia o usuário na escolha das diferentes funções. Teclas Soft Touch.":{"en":"This innovative and dynamic instrument guides the user in choosing the different functions. Soft Touch keys.","it":"Questo strumento innovativo e dinamico guida l'utente nella scelta delle diverse funzioni. Tasti Soft Touch."},"USB port to recharge mobile devices.":{"en":"USB port to recharge mobile devices.","it":"USB port to recharge mobile devices."},"CONECTOR USB":{"en":"USB CONNECTOR","it":"CONNETTORE USB"},"O software sofisticado otimiza o desempenho programando o treino de acordo com as necessidades do usuário, mantendo o esforço sempre sob controle.":{"en":"The sophisticated software optimizes performance by programming the workout according to the user's needs, keeping effort always under control.","it":"Il software raffinato ottimizza le prestazioni programmando l'allenamento in base alle esigenze dell'utente, mantenendo lo sforzo sempre sotto controllo."},"Cuidado exclusivo com os detalhes (ex.: suporte para garrafa).":{"en":"Exclusive care for details (e.g. bottle holder).","it":"Cura esclusiva dei dettagli (es.: portaborraccia)."},"CUIDADO EXCLUSIVO":{"en":"EXCLUSIVE CARE","it":"CURA ESCLUSIVA"},"A máquina permite o monitoramento da frequência cardíaca tanto por receptor telemétrico quanto por sensores manuais localizados no guidão. A seleção do dispositivo é automática, dando prioridade à faixa telemétrica (receptor Polar).":{"en":"The machine allows heart rate monitoring both through a telemetric receiver and through hand sensors located on the handlebar. Device selection is automatic, giving priority to the telemetric strap (Polar receiver).","it":"La macchina consente il monitoraggio della frequenza cardiaca sia tramite ricevitore telemetrico sia tramite sensori manuali posti sul manubrio. La selezione del dispositivo è automatica, con priorità alla fascia telemetrica (ricevitore Polar)."},"RECEPTOR TELEMÉTRICO":{"en":"TELEMETRIC RECEIVER","it":"RICEVITORE TELEMETRICO"},"Fantastic – SOMENTE PARA OS FORTES":{"en":"Fantastic – ONLY FOR THE STRONG","it":"Fantastic – SOLO PER I FORTI"},"Hoje, assim como há 40 anos, os verdadeiros campeões treinam com a Panatta Sport.\nForça, tradição e performance em cada detalhe.":{"en":"Today, just as 40 years ago, true champions train with Panatta Sport.\nStrength, tradition and performance in every detail.","it":"Oggi, come 40 anni fa, i veri campioni si allenano con Panatta Sport.\nForza, tradizione e prestazioni in ogni dettaglio."},"Em 1984, criei a linha Fantastic.\nEla foi um sucesso internacional imediato — seu design, durabilidade e funcionalidade conquistaram clientes no mundo inteiro.\nAgora, em 2024 – 40 anos depois, senti que era o momento de reviver essa linha icônica: mantendo seu design inconfundível, atualizando a biomecânica para os padrões atuais, utilizando materiais muito superiores aos do passado e, acima de tudo, com a mesma paixão que sempre moveu a Panatta Sport — ontem e hoje.":{"en":"In 1984, I created the Fantastic line.\nIt was an immediate international success — its design, durability and functionality won over customers all over the world.\nNow, in 2024 – 40 years later, I felt it was time to revive this iconic line: keeping its unmistakable design, updating the biomechanics to today's standards, using materials far superior to those of the past and, above all, with the same passion that has always driven Panatta Sport — yesterday and today.","it":"Nel 1984 ho creato la linea Fantastic.\nFu un successo internazionale immediato — il suo design, la sua durata e la sua funzionalità conquistarono clienti in tutto il mondo.\nOra, nel 2024 – 40 anni dopo, ho sentito che era il momento di far rivivere questa linea iconica: mantenendo il suo design inconfondibile, aggiornando la biomeccanica agli standard attuali, utilizzando materiali molto superiori a quelli del passato e, soprattutto, con la stessa passione che ha sempre mosso Panatta Sport — ieri e oggi."},"As Lendas Estão de Volta":{"en":"The Legends Are Back","it":"Le Leggende Sono Tornate"},"Um tributo claro à era de ouro do fisiculturismo.":{"en":"A clear tribute to the golden age of bodybuilding.","it":"Un chiaro tributo all'età d'oro del bodybuilding."},"SISTEMA DE TRANSMISSÃO POR CORRENTE":{"en":"CHAIN TRANSMISSION SYSTEM","it":"SISTEMA DI TRASMISSIONE A CATENA"},"Sistema livre de manutenção, com máxima confiabilidade a longo prazo.":{"en":"Maintenance-free system, with maximum long-term reliability.","it":"Sistema senza manutenzione, con la massima affidabilità nel lungo periodo."},"MOVIMENTO COM CAME":{"en":"CAM MOVEMENT","it":"MOVIMENTO A CAMMA"},"Cada máquina possui uma came especialmente projetada para garantir a curva de carga ideal.":{"en":"Each machine has a specially designed cam to ensure the ideal load curve.","it":"Ogni macchina ha una camma appositamente progettata per garantire la curva di carico ideale."},"INDESTRUTÍVEL":{"en":"INDESTRUCTIBLE","it":"INDISTRUTTIBILE"},"Estrutura metálica e acabamentos reforçados para uma durabilidade incomparável — como há 40 anos.":{"en":"Metal frame and reinforced finishes for unmatched durability — just like 40 years ago.","it":"Struttura metallica e finiture rinforzate per una durata impareggiabile — come 40 anni fa."},"IDEAL PARA CARGAS EXTREMAS":{"en":"IDEAL FOR EXTREME LOADS","it":"IDEALE PER CARICHI ESTREMI"},"Graças ao sistema de tração, estrutura robusta e stacks atualizados, é perfeita para treinos pesados de campeões de todas as gerações.":{"en":"Thanks to the traction system, robust frame and updated stacks, it is perfect for heavy training by champions of every generation.","it":"Grazie al sistema di trazione, alla struttura robusta e ai pacchi pesi aggiornati, è perfetta per gli allenamenti pesanti dei campioni di tutte le generazioni."},"Assim como há 40 anos, os verdadeiros campeões treinam com a Panatta Sport.":{"en":"Just as 40 years ago, true champions train with Panatta Sport.","it":"Come 40 anni fa, i veri campioni si allenano con Panatta Sport."},"O lendário Lee Haney, 8 vezes Mr. Olympia e ícone da era dourada do fisiculturismo, abraça a visão de Rudi Panatta e se torna o embaixador oficial desse relançamento histórico.\nTreinar com a nova linha Fantastic é reviver a era de ouro e sentir-se como um campeão lendário.":{"en":"The legendary Lee Haney, 8-time Mr. Olympia and icon of bodybuilding's golden era, embraces Rudi Panatta's vision and becomes the official ambassador of this historic relaunch.\nTraining with the new Fantastic line is reliving the golden age and feeling like a legendary champion.","it":"Il leggendario Lee Haney, 8 volte Mr. Olympia e icona dell'età d'oro del bodybuilding, abbraccia la visione di Rudi Panatta e diventa l'ambasciatore ufficiale di questo storico rilancio.\nAllenarsi con la nuova linea Fantastic significa rivivere l'età d'oro e sentirsi un campione leggendario."},"A história do fisiculturismo passa pela Panatta Sport":{"en":"The history of bodybuilding goes through Panatta Sport","it":"La storia del bodybuilding passa da Panatta Sport"},"Assim como os grandes campeões, Lee Haney já reconhecia a excelência das máquinas Fantastic em sua versão original — equipamentos que marcaram para sempre a história do fisiculturismo.\nO legado da Panatta Sport inclui modelos icônicos que impulsionaram o sucesso da linha, como o Hack Squat, utilizado por Haney em sua preparação para o Mr. Olympia.\nAo longo dos anos, muitos tentaram copiar esses equipamentos. Mas ser copiado é prova de que se foi o primeiro — ontem e hoje.\nEssa é a história de uma marca. De uma lenda.":{"en":"Like the great champions, Lee Haney already recognized the excellence of the Fantastic machines in their original version — equipment that forever marked the history of bodybuilding.\nPanatta Sport's legacy includes iconic models that drove the line's success, such as the Hack Squat, used by Haney in his preparation for Mr. Olympia.\nOver the years, many have tried to copy this equipment. But being copied is proof of having been the first — yesterday and today.\nThis is the story of a brand. Of a legend.","it":"Come i grandi campioni, Lee Haney riconosceva già l'eccellenza delle macchine Fantastic nella loro versione originale — attrezzature che hanno segnato per sempre la storia del bodybuilding.\nL'eredità di Panatta Sport comprende modelli iconici che hanno trainato il successo della linea, come l'Hack Squat, utilizzato da Haney nella sua preparazione per Mr. Olympia.\nNel corso degli anni, molti hanno cercato di copiare queste attrezzature. Ma essere copiati è la prova di essere stati i primi — ieri e oggi.\nQuesta è la storia di un marchio. Di una leggenda."},"Reviva a era de ouro do fisiculturismo com a linha Fantastic.\nDesign old school, biomecânica precisa e performance máxima — treine como os verdadeiros campeões.":{"en":"Relive the golden age of bodybuilding with the Fantastic line.\nOld school design, precise biomechanics and maximum performance — train like true champions.","it":"Rivivi l'età d'oro del bodybuilding con la linea Fantastic.\nDesign old school, biomeccanica precisa e massime prestazioni — allenati come i veri campioni."},"FREEWEIGHT ONE foi criada com foco nos elementos essenciais para um treino ideal.":{"en":"FREEWEIGHT ONE was created with a focus on the essential elements for ideal training.","it":"FREEWEIGHT ONE è stata creata puntando sugli elementi essenziali per un allenamento ideale."},"Biomecânica perfeita da Panatta: com anos de experiência e atenção aos detalhes, a linha FreeWeight One garante movimentos naturais e fluidos, reduzindo o risco de lesões e aumentando a eficiência dos exercícios.\nUsabilidade: intuitiva e fácil de usar, cada peça foi pensada para facilitar a experiência do usuário, permitindo foco total no treino. Os ajustes são rápidos e simples, adaptando-se a todos os níveis de preparo físico.\nAlta performance: fabricada com materiais de alta qualidade e tecnologias avançadas, a FreeWeight One oferece desempenho elevado e durabilidade. Sua estrutura robusta permite a execução de treinos intensos com total segurança.\nDesign compacto: uma linha de pesos livres desenvolvida para ocupar o menor espaço possível, sem comprometer a funcionalidade. Ideal tanto para grandes academias quanto para ambientes menores, garantindo uma disposição eficiente dos equipamentos.\nA FreeWeight One foi projetada para proporcionar um treino eficiente e confortável, mantendo os altos padrões de qualidade e durabilidade que definem os equipamentos Panatta. Cada detalhe foi cuidadosamente elaborado para atender às necessidades de todos os perfis de atletas, dos iniciantes aos profissionais.\nCom a FreeWeight One, a excelência no treino com carga livre está ao alcance de todos.":{"en":"Perfect Panatta biomechanics: with years of experience and attention to detail, the FreeWeight One line ensures natural and fluid movements, reducing the risk of injury and increasing exercise efficiency.\nUsability: intuitive and easy to use, each piece was designed to make the user experience easier, allowing total focus on training. Adjustments are quick and simple, adapting to all fitness levels.\nHigh performance: made with high-quality materials and advanced technologies, FreeWeight One offers high performance and durability. Its robust structure allows intense workouts to be performed with total safety.\nCompact design: a free-weight line developed to take up as little space as possible without compromising functionality. Ideal for both large gyms and smaller spaces, ensuring efficient equipment layout.\nFreeWeight One was designed to provide efficient and comfortable training while maintaining the high standards of quality and durability that define Panatta equipment. Every detail was carefully crafted to meet the needs of all athlete profiles, from beginners to professionals.\nWith FreeWeight One, excellence in free-weight training is within everyone's reach.","it":"Biomeccanica perfetta Panatta: con anni di esperienza e attenzione ai dettagli, la linea FreeWeight One garantisce movimenti naturali e fluidi, riducendo il rischio di infortuni e aumentando l'efficacia degli esercizi.\nUsabilità: intuitiva e facile da usare, ogni attrezzo è stato pensato per facilitare l'esperienza dell'utente, permettendo la massima concentrazione sull'allenamento. Le regolazioni sono rapide e semplici, adattandosi a tutti i livelli di preparazione fisica.\nAlte prestazioni: realizzata con materiali di alta qualità e tecnologie avanzate, FreeWeight One offre prestazioni elevate e durata. La sua struttura robusta consente di eseguire allenamenti intensi in totale sicurezza.\nDesign compatto: una linea a pesi liberi sviluppata per occupare il minor spazio possibile senza compromettere la funzionalità. Ideale sia per le grandi palestre sia per gli ambienti più piccoli, garantendo una disposizione efficiente delle attrezzature.\nFreeWeight One è stata progettata per offrire un allenamento efficiente e confortevole, mantenendo gli elevati standard di qualità e durata che definiscono le attrezzature Panatta. Ogni dettaglio è stato curato per soddisfare le esigenze di tutti i profili di atleti, dai principianti ai professionisti.\nCon FreeWeight One, l'eccellenza nell'allenamento a carico libero è alla portata di tutti."},"A Panatta oferece a oportunidade de personalizar seus equipamentos com mais de 2.000 combinações de cores entre estrutura e estofamento.\nAlém disso, é possível bordar o logotipo do seu centro diretamente no produto, tornando cada peça única e exclusiva!":{"en":"Panatta offers the opportunity to personalize your equipment with more than 2,000 color combinations between frame and upholstery.\nIn addition, you can embroider your center's logo directly on the product, making each piece unique and exclusive!","it":"Panatta offre la possibilità di personalizzare le tue attrezzature con oltre 2.000 combinazioni di colori tra telaio e imbottitura.\nInoltre, è possibile ricamare il logo del tuo centro direttamente sul prodotto, rendendo ogni attrezzo unico ed esclusivo!"},"Descubra a FreeWeight One: biomecânica precisa, alta performance e design compacto para treinos intensos com conforto e segurança.":{"en":"Discover FreeWeight One: precise biomechanics, high performance and compact design for intense workouts with comfort and safety.","it":"Scopri FreeWeight One: biomeccanica precisa, alte prestazioni e design compatto per allenamenti intensi con comfort e sicurezza."},"Exemplo de excelência e exclusividade em biomecânica, a linha Freeweight HP oferece uma gama completa de máquinas e bancos com pesos livres, desenvolvidos para potencializar a força e a resistência de diferentes grupos musculares — componentes essenciais para a performance física de alto nível.":{"en":"An example of excellence and exclusivity in biomechanics, the Freeweight HP line offers a complete range of free-weight machines and benches, developed to enhance the strength and endurance of different muscle groups — essential components for high-level physical performance.","it":"Esempio di eccellenza ed esclusività nella biomeccanica, la linea Freeweight HP offre una gamma completa di macchine e panche a pesi liberi, sviluppate per potenziare la forza e la resistenza dei diversi gruppi muscolari — componenti essenziali per la performance fisica di alto livello."},"A Freeweight HP foi criada para desenvolver força, potência e velocidade, sendo a escolha de atletas de renome internacional para seus treinos diários.\nOs equipamentos isotônicos Freeweight High Performance são incomparáveis no mercado, oferecendo o que há de mais avançado em biomecânica articular, permitindo treinos de alta performance com total segurança e conforto.":{"en":"Freeweight HP was created to develop strength, power and speed, and is the choice of internationally renowned athletes for their daily training.\nFreeweight High Performance isotonic equipment is unmatched on the market, offering the most advanced joint biomechanics and allowing high-performance training with total safety and comfort.","it":"Freeweight HP è stata creata per sviluppare forza, potenza e velocità ed è la scelta di atleti di fama internazionale per i loro allenamenti quotidiani.\nLe attrezzature isotoniche Freeweight High Performance non hanno eguali sul mercato, offrendo quanto di più avanzato esista nella biomeccanica articolare e consentendo allenamenti ad alte prestazioni in totale sicurezza e comfort."},"Destaques biomecânicos:":{"en":"Biomechanical highlights:","it":"Punti di forza biomeccanici:"},"Planos de movimento fisiológicos":{"en":"Physiological planes of movement","it":"Piani di movimento fisiologici"},"Tensão constante e equilibrada durante toda a amplitude":{"en":"Constant, balanced tension throughout the range of motion","it":"Tensione costante ed equilibrata per tutta l'escursione"},"Posicionamento preciso dos centros articulares":{"en":"Precise positioning of the joint centers","it":"Posizionamento preciso dei centri articolari"},"Alavancas de pré-carga que reduzem o estresse articular":{"en":"Pre-load levers that reduce joint stress","it":"Leve di pre-carico che riducono lo stress articolare"},"Contrapesos que tornam os quilos levantados reais":{"en":"Counterweights that make the kilos lifted real","it":"Contrappesi che rendono reali i chili sollevati"},"Ajustes de assento e encosto com assistência a gás":{"en":"Gas-assisted seat and backrest adjustments","it":"Regolazioni di sedile e schienale con assistenza a gas"},"A trajetória da máquina Free Weight é biomecanicamente correta. Você irá atingir cada grupo muscular de forma perfeita.":{"en":"The trajectory of the Free Weight machine is biomechanically correct. You will target each muscle group perfectly.","it":"La traiettoria della macchina Free Weight è biomeccanicamente corretta. Colpirai ogni gruppo muscolare in modo perfetto."},"PLANOS DE TREINAMENTO FISIOLÓGICO":{"en":"PHYSIOLOGICAL TRAINING PLANES","it":"PIANI DI ALLENAMENTO FISIOLOGICI"},"Os pesos são distribuídos ao longo da amplitude do movimento com uma tensão constante durante toda a execução. Isso ajuda a superar os pontos de dificuldade no início e no final do movimento.":{"en":"Weights are distributed along the range of motion with constant tension throughout the execution. This helps overcome the sticking points at the beginning and end of the movement.","it":"I pesi sono distribuiti lungo l'escursione del movimento con una tensione costante durante tutta l'esecuzione. Questo aiuta a superare i punti critici all'inizio e alla fine del movimento."},"TENSÃO UNIFORME E CONSTANTE AO LONGO DE TODA A AMPLITUDE DO MOVIMENTO":{"en":"UNIFORM AND CONSTANT TENSION THROUGHOUT THE ENTIRE RANGE OF MOTION","it":"TENSIONE UNIFORME E COSTANTE LUNGO TUTTA L'ESCURSIONE DEL MOVIMENTO"},"Posicionar-se corretamente é essencial para um treino seguro e eficaz. De acordo com a fisiologia humana e a biomecânica articular, suas articulações devem estar alinhadas com os fulcros ou pontos de pivô das alavancas da máquina.":{"en":"Positioning yourself correctly is essential for safe and effective training. According to human physiology and joint biomechanics, your joints should be aligned with the fulcrums or pivot points of the machine's levers.","it":"Posizionarsi correttamente è essenziale per un allenamento sicuro ed efficace. Secondo la fisiologia umana e la biomeccanica articolare, le articolazioni devono essere allineate con i fulcri o punti di rotazione delle leve della macchina."},"AJUSTE ADEQUADO ALINHADO AOS PONTOS DE PIVÔ":{"en":"PROPER ADJUSTMENT ALIGNED WITH THE PIVOT POINTS","it":"REGOLAZIONE CORRETTA ALLINEATA AI PUNTI DI ROTAZIONE"},"A plataforma antiderrapante garante máxima segurança e estabilidade dos pés, mesmo nos exercícios mais desafiadores. Um sistema de pantógrafo gerencia a inclinação da plataforma de acordo com a flexibilidade dos seus tornozelos.":{"en":"The non-slip platform ensures maximum safety and foot stability, even in the most challenging exercises. A pantograph system manages the platform's incline according to the flexibility of your ankles.","it":"La pedana antiscivolo garantisce la massima sicurezza e stabilità dei piedi, anche negli esercizi più impegnativi. Un sistema a pantografo gestisce l'inclinazione della pedana in base alla flessibilità delle tue caviglie."},"PLATAFORMAS INCLINÁVEIS":{"en":"TILTING PLATFORMS","it":"PEDANE INCLINABILI"},"PLATAFORMA ANTIDERRAPANTE E SISTEMA DE GESTÃO DE INCLINAÇÃO COM PANTÓGRAFO":{"en":"NON-SLIP PLATFORM AND PANTOGRAPH INCLINE MANAGEMENT SYSTEM","it":"PEDANA ANTISCIVOLO E SISTEMA DI GESTIONE DELL'INCLINAZIONE A PANTOGRAFO"},"A alavanca de entrada facilitada permite que você assuma a posição ideal para manter as articulações alinhadas aos pontos de pivô. Além disso, torna mais fácil iniciar o movimento mesmo com a máquina na carga máxima.":{"en":"The easy-entry lever lets you take the ideal position to keep your joints aligned with the pivot points. It also makes it easier to start the movement even with the machine at maximum load.","it":"La leva di ingresso facilitato ti permette di assumere la posizione ideale per mantenere le articolazioni allineate ai punti di rotazione. Inoltre, rende più facile iniziare il movimento anche con la macchina al carico massimo."},"ALAVANCA DE ENTRADA FACILITADA":{"en":"EASY-ENTRY LEVER","it":"LEVA DI INGRESSO FACILITATO"},"Os pontos de pivô acompanham seu posicionamento durante os movimentos mais complexos e mantêm o foco nos grupos musculares-alvo.":{"en":"The pivot points follow your positioning during the most complex movements and keep the focus on the target muscle groups.","it":"I punti di rotazione seguono il tuo posizionamento durante i movimenti più complessi e mantengono il focus sui gruppi muscolari target."},"AJUSTE DOS PONTOS DE PIVÔ":{"en":"PIVOT POINT ADJUSTMENT","it":"REGOLAZIONE DEI PUNTI DI ROTAZIONE"},"Molas assistidas a gás permitem ajustar assentos e apoios com facilidade.":{"en":"Gas-assisted springs make it easy to adjust seats and supports.","it":"Molle assistite a gas permettono di regolare sedili e appoggi con facilità."},"ASSENTO COM AJUSTE A GÁS":{"en":"GAS-ADJUSTED SEAT","it":"SEDILE CON REGOLAZIONE A GAS"},"A Panatta oferece a você a oportunidade de personalizar seus equipamentos, com mais de 2.000 combinações de cores diferentes (estrutura/estofamento). Você também poderá bordar o logo do seu centro no produto, tornando-o único e exclusivo!":{"en":"Panatta offers you the opportunity to personalize your equipment, with more than 2,000 different color combinations (frame/upholstery). You can also embroider your center's logo on the product, making it unique and exclusive!","it":"Panatta ti offre la possibilità di personalizzare le tue attrezzature, con oltre 2.000 diverse combinazioni di colori (telaio/imbottitura). Potrai anche ricamare il logo del tuo centro sul prodotto, rendendolo unico ed esclusivo!"},"Freeweight HP componentes essenciais para a performance física de alto nível.":{"en":"Freeweight HP, essential components for high-level physical performance.","it":"Freeweight HP, componenti essenziali per la performance fisica di alto livello."},"FreeWeight Special é a evolução da excelência biomecânica e do design.\nUma linha de máquinas de pesos livres full optional, equipada com sistemas que garantem extrema funcionalidade e precisão.":{"en":"FreeWeight Special is the evolution of biomechanical and design excellence.\nA line of full-optional free-weight machines, equipped with systems that ensure extreme functionality and precision.","it":"FreeWeight Special è l'evoluzione dell'eccellenza biomeccanica e del design.\nUna linea di macchine a pesi liberi full optional, dotata di sistemi che garantiscono estrema funzionalità e precisione."},"FreeWeight Special é a evolução natural da excelência em biomecânica e design.\nTrata-se de uma linha completa de máquinas de pesos livres, totalmente equipada com sistemas que garantem funcionalidade e precisão.\nA FreeWeight Special não possui concorrentes no mercado, representando o que há de mais avançado em biomecânica articular para a realização de treinos de alta intensidade com total segurança e conforto.":{"en":"FreeWeight Special is the natural evolution of excellence in biomechanics and design.\nIt is a complete line of free-weight machines, fully equipped with systems that ensure functionality and precision.\nFreeWeight Special has no competitors on the market, representing the most advanced joint biomechanics for high-intensity training with total safety and comfort.","it":"FreeWeight Special è l'evoluzione naturale dell'eccellenza nella biomeccanica e nel design.\nSi tratta di una linea completa di macchine a pesi liberi, interamente dotata di sistemi che garantiscono funzionalità e precisione.\nFreeWeight Special non ha concorrenti sul mercato e rappresenta quanto di più avanzato esista nella biomeccanica articolare per allenamenti ad alta intensità in totale sicurezza e comfort."},"FreeWeight Special é a evolução da biomecânica e do design, com máquinas de pesos livres completas, funcionais e precisas — conheça agora e leve sua performance ao limite!":{"en":"FreeWeight Special is the evolution of biomechanics and design, with complete, functional and precise free-weight machines — discover it now and take your performance to the limit!","it":"FreeWeight Special è l'evoluzione della biomeccanica e del design, con macchine a pesi liberi complete, funzionali e precise — scoprila ora e porta le tue prestazioni al limite!"},"A linha de equipamentos isotônicos da Panatta, com design atrativo, estrutura robusta e excelente custo-benefício, se destaca pela alta competitividade no mercado.":{"en":"Panatta's isotonic equipment line, with attractive design, robust structure and excellent value for money, stands out for its high competitiveness on the market.","it":"La linea di attrezzature isotoniche di Panatta, con design attraente, struttura robusta e ottimo rapporto qualità-prezzo, si distingue per l'alta competitività sul mercato."},"A Panatta oferece a oportunidade de personalizar seus equipamentos, com mais de 2.000 combinações de cores disponíveis entre estrutura e estofamento.\nAlém disso, é possível bordar o logotipo do seu centro diretamente no produto, tornando cada peça única e exclusiva.":{"en":"Panatta offers the opportunity to personalize your equipment, with more than 2,000 color combinations available between frame and upholstery.\nIn addition, you can embroider your center's logo directly on the product, making each piece unique and exclusive.","it":"Panatta offre la possibilità di personalizzare le tue attrezzature, con oltre 2.000 combinazioni di colori disponibili tra telaio e imbottitura.\nInoltre, è possibile ricamare il logo del tuo centro direttamente sul prodotto, rendendo ogni attrezzo unico ed esclusivo."},"Sec performance, durabilidade e design com excelente custo-benefício.":{"en":"Sec: performance, durability and design with excellent value for money.","it":"Sec: prestazioni, durata e design con un ottimo rapporto qualità-prezzo."},"Design biomecânico de ponta\nassinado pela Panatta. A linha Fit Evo é a combinação perfeita entre funcionalidade e estética, garantindo o máximo conforto para todos os usuários.":{"en":"Cutting-edge biomechanical design\nsigned by Panatta. The Fit Evo line is the perfect combination of functionality and aesthetics, ensuring maximum comfort for all users.","it":"Design biomeccanico d'avanguardia\nfirmato Panatta. La linea Fit Evo è la combinazione perfetta tra funzionalità ed estetica, garantendo il massimo comfort a tutti gli utenti."},"A FitEvo representa uma verdadeira evolução no treinamento isotônico:":{"en":"FitEvo represents a true evolution in isotonic training:","it":"FitEvo rappresenta una vera evoluzione nell'allenamento isotonico:"},"alavancas de pré-carga que preservam as articulações de esforços desnecessários, e movimentos circulares convergentes que garantem uma execução fluida e natural dos exercícios.\nCom um design moderno e materiais de alta qualidade, a linha inclui 53 máquinas e 27 bancos, unindo desempenho, ergonomia e estética em cada detalhe.":{"en":"pre-load levers that protect the joints from unnecessary strain, and converging circular movements that ensure fluid and natural exercise execution.\nWith modern design and high-quality materials, the line includes 53 machines and 27 benches, combining performance, ergonomics and aesthetics in every detail.","it":"leve di pre-carico che preservano le articolazioni da sforzi inutili e movimenti circolari convergenti che garantiscono un'esecuzione fluida e naturale degli esercizi.\nCon un design moderno e materiali di alta qualità, la linea comprende 53 macchine e 27 panche, unendo prestazioni, ergonomia ed estetica in ogni dettaglio."},"O sistema de ajuste de assento da Panatta, com pistões a gás, permite ao usuário selecionar facilmente a posição ideal de treino com praticidade e precisão.":{"en":"Panatta's seat adjustment system, with gas pistons, allows the user to easily select the ideal training position with practicality and precision.","it":"Il sistema di regolazione del sedile Panatta, con pistoni a gas, consente all'utente di selezionare facilmente la posizione di allenamento ideale con praticità e precisione."},"ASSENTO E ENCOSTO":{"en":"SEAT AND BACKREST","it":"SEDILE E SCHIENALE"},"As cames garantem uma tensão de carga ideal durante o exercício. As posições de execução podem ser ajustadas por meio de um regulador, que define o ângulo inicial do movimento.":{"en":"The cams ensure ideal load tension during exercise. The execution positions can be adjusted with a regulator, which defines the starting angle of the movement.","it":"Le camme garantiscono una tensione di carico ideale durante l'esercizio. Le posizioni di esecuzione possono essere regolate tramite un regolatore che definisce l'angolo iniziale del movimento."},"CAMES":{"en":"CAMS","it":"CAMME"},"Máxima atenção aos detalhes. O carter em policarbonato transparente protege a coluna de pesos e garante a segurança do usuário, ao mesmo tempo em que mantém visível o movimento das cargas durante o exercício.":{"en":"Maximum attention to detail. The transparent polycarbonate guard protects the weight stack and ensures user safety, while keeping the movement of the loads visible during exercise.","it":"Massima attenzione ai dettagli. Il carter in policarbonato trasparente protegge il pacco pesi e garantisce la sicurezza dell'utente, mantenendo visibile il movimento dei carichi durante l'esercizio."},"COLUNA DE PESOS":{"en":"WEIGHT STACK","it":"PACCO PESI"},"O acolchoamento anatômico em poliuretano, desenvolvido pela Panatta, garante máxima ergonomia e funcionalidade durante o treino.":{"en":"The anatomical polyurethane padding, developed by Panatta, ensures maximum ergonomics and functionality during training.","it":"L'imbottitura anatomica in poliuretano, sviluppata da Panatta, garantisce la massima ergonomia e funzionalità durante l'allenamento."},"ESTOFAMENTO":{"en":"UPHOLSTERY","it":"IMBOTTITURA"},"FitEvo é a evolução do treino isotônico, com alavancas de pré-carga que protegem as articulações e movimentos convergentes que garantem fluidez.":{"en":"FitEvo is the evolution of isotonic training, with pre-load levers that protect the joints and converging movements that ensure fluidity.","it":"FitEvo è l'evoluzione dell'allenamento isotonico, con leve di pre-carico che proteggono le articolazioni e movimenti convergenti che garantiscono fluidità."},"A Monolith representa perfeitamente o DNA da Panatta: constante busca pela excelência em biomecânica, 100% Made in Italy, design único e atenção extrema aos detalhes.\nUma linha de equipamentos isotônicos de alto padrão, que combina luxo e elegância em um estilo que nunca sai de moda.":{"en":"Monolith perfectly represents Panatta's DNA: the constant pursuit of excellence in biomechanics, 100% Made in Italy, unique design and extreme attention to detail.\nA line of high-end isotonic equipment that combines luxury and elegance in a style that never goes out of fashion.","it":"Monolith rappresenta perfettamente il DNA di Panatta: costante ricerca dell'eccellenza biomeccanica, 100% Made in Italy, design unico ed estrema attenzione ai dettagli.\nUna linea di attrezzature isotoniche di alto livello, che unisce lusso ed eleganza in uno stile che non passa mai di moda."},"Monolith representa perfeitamente o DNA da Panatta: pesquisa constante por biomecânica de excelência, 100% Made in Italy, design exclusivo e atenção extrema aos detalhes.\nUma linha isotônica topo de linha que combina luxo e elegância em um estilo atemporal.":{"en":"Monolith perfectly represents Panatta's DNA: constant research into excellent biomechanics, 100% Made in Italy, exclusive design and extreme attention to detail.\nA top-of-the-range isotonic line that combines luxury and elegance in a timeless style.","it":"Monolith rappresenta perfettamente il DNA di Panatta: ricerca costante di una biomeccanica d'eccellenza, 100% Made in Italy, design esclusivo ed estrema attenzione ai dettagli.\nUna linea isotonica top di gamma che unisce lusso ed eleganza in uno stile senza tempo."},"Monolith é a mais alta expressão do design tipicamente italiano.\nLinearidade morfológica e continuidade são elementos presentes em cada modelo. A \"faixa\" é a tendência estética que molda as formas e define novas maneiras de organizar o espaço.\nDesign patenteado.":{"en":"Monolith is the highest expression of typically Italian design.\nMorphological linearity and continuity are present in every model. The \"band\" is the aesthetic trend that shapes the forms and defines new ways of organizing space.\nPatented design.","it":"Monolith è la più alta espressione del design tipicamente italiano.\nLinearità morfologica e continuità sono elementi presenti in ogni modello. La \"fascia\" è la tendenza estetica che modella le forme e definisce nuovi modi di organizzare lo spazio.\nDesign brevettato."},"A ARTE DO MADE IN ITALY":{"en":"THE ART OF MADE IN ITALY","it":"L'ARTE DEL MADE IN ITALY"},"Os materiais respeitam o meio ambiente e são, em sua maioria, recicláveis em todos os seus componentes. As estofagens são feitas exclusivamente em couro ecológico, sem ftalatos, e as estruturas em ligas metálicas e plástico.":{"en":"The materials respect the environment and are, for the most part, recyclable in all their components. Upholstery is made exclusively of phthalate-free eco-leather, and the frames of metal alloys and plastic.","it":"I materiali rispettano l'ambiente e sono, per la maggior parte, riciclabili in tutti i loro componenti. Le imbottiture sono realizzate esclusivamente in ecopelle senza ftalati e i telai in leghe metalliche e plastica."},"ECOSSUSTENTABILIDADE":{"en":"ECO-SUSTAINABILITY","it":"ECOSOSTENIBILITÀ"},"Monolith é sinônimo de inovação no aproveitamento do espaço. Uma linha compacta, projetada para otimizar ambientes e oferecer o máximo de estações de trabalho.\nO design inovador das máquinas permite três configurações diferentes: estação única, costas com costas e layout com 4 estações.":{"en":"Monolith is synonymous with innovation in the use of space. A compact line, designed to optimize environments and offer the maximum number of workstations.\nThe machines' innovative design allows three different configurations: single station, back to back and a 4-station layout.","it":"Monolith è sinonimo di innovazione nello sfruttamento dello spazio. Una linea compatta, progettata per ottimizzare gli ambienti e offrire il massimo numero di postazioni di lavoro.\nIl design innovativo delle macchine consente tre diverse configurazioni: postazione singola, schiena contro schiena e layout a 4 postazioni."},"Máquinas perfeitas em funcionamento e ergonomia, resultado de anos de experiência e alinhadas à filosofia da Panatta.\nA biomecânica é derivada do desenvolvimento da linha Free Weight, criada para atender aos rigorosos padrões de treino de atletas e profissionais do setor, garantindo máximo desempenho com total segurança.":{"en":"Machines that are perfect in operation and ergonomics, the result of years of experience and in line with Panatta's philosophy.\nThe biomechanics derive from the development of the Free Weight line, created to meet the rigorous training standards of athletes and industry professionals, ensuring maximum performance with total safety.","it":"Macchine perfette nel funzionamento e nell'ergonomia, frutto di anni di esperienza e in linea con la filosofia di Panatta.\nLa biomeccanica deriva dallo sviluppo della linea Free Weight, creata per soddisfare i rigorosi standard di allenamento di atleti e professionisti del settore, garantendo il massimo delle prestazioni in totale sicurezza."},"EXCLUSIVIDADE BIOMECÂNICA":{"en":"BIOMECHANICAL EXCLUSIVITY","it":"ESCLUSIVITÀ BIOMECCANICA"},"Adapta-se perfeitamente à estrutura do corpo durante a execução de movimentos particularmente complexos, mantendo o esforço concentrado nos músculos-alvo.":{"en":"It adapts perfectly to the body's structure during particularly complex movements, keeping the effort concentrated on the target muscles.","it":"Si adatta perfettamente alla struttura del corpo durante l'esecuzione di movimenti particolarmente complessi, mantenendo lo sforzo concentrato sui muscoli target."},"AJUSTE DOS CENTROS DE ROTAÇÃO":{"en":"ADJUSTMENT OF THE CENTERS OF ROTATION","it":"REGOLAZIONE DEI CENTRI DI ROTAZIONE"},"A trajetória das máquinas é biomecanicamente correta, garantindo um trabalho preciso sobre os músculos-alvo.":{"en":"The machines' trajectory is biomechanically correct, ensuring precise work on the target muscles.","it":"La traiettoria delle macchine è biomeccanicamente corretta, garantendo un lavoro preciso sui muscoli target."},"PLANOS DE TRABALHO FISIOLÓGICOS":{"en":"PHYSIOLOGICAL WORK PLANES","it":"PIANI DI LAVORO FISIOLOGICI"},"As cargas de trabalho são distribuídas de acordo com a trajetória do movimento, com uma tensão equilibrada em todo o arco, acompanhando de forma precisa as curvas de força dos músculos-alvo.":{"en":"Workloads are distributed according to the trajectory of the movement, with balanced tension throughout the arc, precisely following the strength curves of the target muscles.","it":"I carichi di lavoro sono distribuiti in base alla traiettoria del movimento, con una tensione equilibrata lungo tutto l'arco, seguendo con precisione le curve di forza dei muscoli target."},"TENSÃO EQUILIBRADA EM TODO O ARCO DE MOVIMENTO":{"en":"BALANCED TENSION THROUGHOUT THE ARC OF MOVEMENT","it":"TENSIONE EQUILIBRATA LUNGO TUTTO L'ARCO DI MOVIMENTO"},"O uso de CAMES (Movimento de Adaptação Contínua), desenvolvidos especificamente para cada máquina, permite uma adaptação estrutural da carga, que corresponde exatamente à curva de força do músculo-alvo.":{"en":"The use of CAMS (Continuous Adaptation Movement), developed specifically for each machine, allows a structural adaptation of the load that corresponds exactly to the strength curve of the target muscle.","it":"L'uso di CAMME (Movimento di Adattamento Continuo), sviluppate appositamente per ogni macchina, consente un adattamento strutturale del carico che corrisponde esattamente alla curva di forza del muscolo target."},"CAMES E CENTROS DE ROTAÇÃO":{"en":"CAMS AND CENTERS OF ROTATION","it":"CAMME E CENTRI DI ROTAZIONE"},"Possui uma alavanca de pré-carga que permite a todos os tipos de usuários iniciar e finalizar o exercício sem sobrecarga nas articulações.":{"en":"It has a pre-load lever that allows all types of users to start and finish the exercise without overloading the joints.","it":"Dispone di una leva di pre-carico che consente a tutti i tipi di utenti di iniziare e terminare l'esercizio senza sovraccaricare le articolazioni."},"ALAVANCA DE PRÉ-CARGA":{"en":"PRE-LOAD LEVER","it":"LEVA DI PRE-CARICO"},"Sistema de seleção de carga progressiva com incrementos de 2,5 kg – patente exclusiva da Panatta.":{"en":"Progressive load selection system in 2.5 kg increments – an exclusive Panatta patent.","it":"Sistema di selezione del carico progressivo con incrementi di 2,5 kg – brevetto esclusivo Panatta."},"SISTEMA DE AUMENTO PROGRESSIVO DE CARGA":{"en":"PROGRESSIVE LOAD INCREASE SYSTEM","it":"SISTEMA DI AUMENTO PROGRESSIVO DEL CARICO"},"As máquinas são equipadas com pegadores ergonômicos de diâmetro variável, conforme o movimento seja de empurrar ou puxar. Muitos pegadores são multifuncionais, permitindo a ativação de diferentes músculos-alvo e garantindo que qualquer tipo de usuário execute o exercício corretamente.":{"en":"The machines are equipped with ergonomic grips of variable diameter, depending on whether the movement is pushing or pulling. Many grips are multifunctional, allowing different target muscles to be activated and ensuring any type of user performs the exercise correctly.","it":"Le macchine sono dotate di impugnature ergonomiche a diametro variabile, a seconda che il movimento sia di spinta o di trazione. Molte impugnature sono multifunzionali, permettendo l'attivazione di diversi muscoli target e garantendo che qualsiasi tipo di utente esegua correttamente l'esercizio."},"PEGADORES ERGONÔMICOS E MULTIFUNCIONAIS":{"en":"ERGONOMIC AND MULTIFUNCTIONAL GRIPS","it":"IMPUGNATURE ERGONOMICHE E MULTIFUNZIONALI"},"Os ajustes assistidos a gás do encosto e do assento permitem o posicionamento correto sem a necessidade de sair da máquina.\nNovos mecanismos com movimento pantográfico garantem máxima fluidez e precisão. Características biomecânicas exclusivas para treinos de alto desempenho.":{"en":"Gas-assisted backrest and seat adjustments allow correct positioning without having to get off the machine.\nNew mechanisms with pantographic movement ensure maximum fluidity and precision. Exclusive biomechanical features for high-performance training.","it":"Le regolazioni assistite a gas di schienale e sedile consentono il posizionamento corretto senza dover scendere dalla macchina.\nNuovi meccanismi con movimento a pantografo garantiscono massima fluidità e precisione. Caratteristiche biomeccaniche esclusive per allenamenti ad alte prestazioni."},"AJUSTES ASSISTIDOS A GÁS":{"en":"GAS-ASSISTED ADJUSTMENTS","it":"REGOLAZIONI ASSISTITE A GAS"},"A Panatta oferece a oportunidade de personalizar seus equipamentos, com mais de 2.000 combinações de cores disponíveis (estrutura/estofamento).\nVocê também pode ter o logo do seu centro bordado no produto, tornando-o único e exclusivo.":{"en":"Panatta offers the opportunity to personalize your equipment, with more than 2,000 color combinations available (frame/upholstery).\nYou can also have your center's logo embroidered on the product, making it unique and exclusive.","it":"Panatta offre la possibilità di personalizzare le tue attrezzature, con oltre 2.000 combinazioni di colori disponibili (telaio/imbottitura).\nPuoi anche far ricamare il logo del tuo centro sul prodotto, rendendolo unico ed esclusivo."},"Monolith é a mais alta expressão do design tipicamente italiano.":{"en":"Monolith is the highest expression of typically Italian design.","it":"Monolith è la più alta espressione del design tipicamente italiano."},"O fitness em casa,\ndo seu jeito.":{"en":"Fitness at home,\nyour way.","it":"Il fitness a casa,\na modo tuo."},"A coleção Bespoke foi criada para quem deseja se expressar em cada detalhe. Acabamentos personalizados, materiais exclusivos e detalhes únicos pensados para enriquecer sua casa, iate, escritório ou academia com um toque pessoal. Uma produção totalmente italiana sob medida, para que você possa se presentear com um objeto de design adequado para qualquer ambiente, cenário ou local.\nDescubra os 5 modelos da Coleção Ciclotte Bespoke. Madeira de prestígio, vidro elegante, fibra de carbono leve e mármore refinado: materiais exclusivos que se unem à icônica forma circular da Ciclotte para criar uma peça única e marcante.":{"en":"The Bespoke collection was created for those who want to express themselves in every detail. Custom finishes, exclusive materials and unique details designed to enrich your home, yacht, office or gym with a personal touch. Fully Italian made-to-measure production, so you can treat yourself to a design object suited to any environment, setting or location.\nDiscover the 5 models of the Ciclotte Bespoke Collection. Prestigious wood, elegant glass, light carbon fiber and refined marble: exclusive materials that join Ciclotte's iconic circular shape to create a unique, striking piece.","it":"La collezione Bespoke è stata creata per chi desidera esprimersi in ogni dettaglio. Finiture personalizzate, materiali esclusivi e dettagli unici pensati per arricchire la tua casa, il tuo yacht, il tuo ufficio o la tua palestra con un tocco personale. Una produzione interamente italiana su misura, per regalarti un oggetto di design adatto a qualsiasi ambiente, contesto o luogo.\nScopri i 5 modelli della Collezione Ciclotte Bespoke. Legno pregiato, vetro elegante, fibra di carbonio leggera e marmo raffinato: materiali esclusivi che si uniscono all'iconica forma circolare di Ciclotte per creare un pezzo unico e di carattere."},"Outros ícones de design da coleção Bespoke":{"en":"Other design icons from the Bespoke collection","it":"Altre icone di design della collezione Bespoke"},"Destaque-se na multidão":{"en":"Stand out from the crowd","it":"Distinguiti dalla folla"},"A Ciclotte Carbon e Ciclotte Steel":{"en":"Ciclotte Carbon and Ciclotte Steel","it":"Ciclotte Carbon e Ciclotte Steel"},"A fusão perfeita entre o estático e o dinâmico, entre a elegância e a aventura, entre a forma e o material. Estética e funcionalidade se unem para introduzir o design na vida contemporânea, onde trabalho e relaxamento, exercício e entretenimento compartilham um único espaço.":{"en":"The perfect fusion between static and dynamic, between elegance and adventure, between form and material. Aesthetics and functionality come together to bring design into contemporary life, where work and relaxation, exercise and entertainment share a single space.","it":"La fusione perfetta tra statico e dinamico, tra eleganza e avventura, tra forma e materia. Estetica e funzionalità si uniscono per portare il design nella vita contemporanea, dove lavoro e relax, esercizio e intrattenimento condividono un unico spazio."},"Uma única peça de carbono para criar algo único":{"en":"A single piece of carbon to create something unique","it":"Un unico pezzo di carbonio per creare qualcosa di unico"},"A icônica roda da Ciclotte é feita de uma única peça de fibra de carbono. Sua resistência dá forma a um design puro, unindo produção industrial à precisão artesanal. Um objeto exclusivo, criado com técnicas refinadas para reinventar o design dos equipamentos de academia.":{"en":"Ciclotte's iconic wheel is made from a single piece of carbon fiber. Its strength gives shape to a pure design, uniting industrial production with artisanal precision. An exclusive object, created with refined techniques to reinvent the design of gym equipment.","it":"L'iconica ruota di Ciclotte è realizzata in un unico pezzo di fibra di carbonio.
