 La sua resistenza dà forma a un design puro, unendo produzione industriale e precisione artigianale. Un oggetto esclusivo, creato con tecniche raffinate per reinventare il design delle attrezzature da palestra."},"A elegância do design encontra a emoção de uma bicicleta de corrida.":{"en":"The elegance of design meets the thrill of a racing bike.","it":"L'eleganza del design incontra l'emozione di una bici da corsa."},"Uma experiência completa de treino":{"en":"A complete training experience","it":"Un'esperienza di allenamento completa"},"Fabricada com fibra de carbono e aço de alta resistência, a icônica Ciclotte redefine o ciclismo indoor, proporcionando uma experiência autêntica de pedalada ao ar livre. Sua transmissão eletromagnética oferece um desafio dinâmico, enquanto a flexibilidade lateral do quadro simula os movimentos naturais das pedaladas na estrada.\nO triângulo ergonômico de pontos de contato—guidão, pedais e assento—garante um alinhamento perfeito. O pequeno espaçamento entre os pedais melhora o conforto e a eficiência, como em uma bike de alto desempenho. Inspirada na tecnologia automobilística de corrida, a Ciclotte Carbon leva a precisão dos materiais do automobilismo para sua casa, iate, hotel ou espaço de treino—combinando estilo e performance.":{"en":"Made of carbon fiber and high-strength steel, the iconic Ciclotte redefines indoor cycling, providing an authentic outdoor riding experience. Its electromagnetic transmission offers a dynamic challenge, while the frame's lateral flexibility simulates the natural movements of road cycling.\nThe ergonomic triangle of contact points—handlebar, pedals and saddle—ensures perfect alignment. The narrow spacing between the pedals improves comfort and efficiency, as on a high-performance bike. Inspired by racing car technology, Ciclotte Carbon brings the precision of motorsport materials to your home, yacht, hotel or training space—combining style and performance.","it":"Realizzata in fibra di carbonio e acciaio ad alta resistenza, l'iconica Ciclotte ridefinisce il ciclismo indoor, offrendo un'autentica esperienza di pedalata all'aperto. La trasmissione elettromagnetica offre una sfida dinamica, mentre la flessibilità laterale del telaio simula i movimenti naturali della pedalata su strada.\nIl triangolo ergonomico dei punti di contatto—manubrio, pedali e sella—garantisce un allineamento perfetto. La ridotta distanza tra i pedali migliora comfort ed efficienza, come in una bici ad alte prestazioni. Ispirata alla tecnologia delle auto da corsa, Ciclotte Carbon porta la precisione dei materiali del motorsport nella tua casa, nel tuo yacht, in hotel o nel tuo spazio di allenamento—unendo stile e prestazioni."},"Configuração:":{"en":"Configuration:","it":"Configurazione:"},"Peso":{"en":"Weight","it":"Peso"},"55 kg / 121,3 libras":{"en":"55 kg / 121.3 lb","it":"55 kg / 121,3 libbre"},"Tamanho":{"en":"Size","it":"Dimensioni"},"111 x 111 x 48 cm / 43,7 x 43,7 x 19 pol.":{"en":"111 x 111 x 48 cm / 43.7 x 43.7 x 19 in","it":"111 x 111 x 48 cm / 43,7 x 43,7 x 19 pollici"},"Cores":{"en":"Colors","it":"Colori"},"vermelho, verde, branco, cinza, azul, amarelo, laranja":{"en":"red, green, white, gray, blue, yellow, orange","it":"rosso, verde, bianco, grigio, blu, giallo, arancione"},"Converse com nossa equipe":{"en":"Talk to our team","it":"Parla con il nostro team"},"Melhores detalhes para deixar o treinamento ainda mais completo":{"en":"The finest details to make training even more complete","it":"I migliori dettagli per rendere l'allenamento ancora più completo"},"Kit de acessórios para tablets e smartphones":{"en":"Accessory kit for tablets and smartphones","it":"Kit di accessori per tablet e smartphone"},"Design e tecnologia para você viver ao máximo a experiência Ciclotte. Conecte seu dispositivo, desafie seus amigos ou acompanhe seu progresso.":{"en":"Design and technology for you to live the Ciclotte experience to the fullest. Connect your device, challenge your friends or track your progress.","it":"Design e tecnologia per vivere al massimo l'esperienza Ciclotte. Collega il tuo dispositivo, sfida i tuoi amici o segui i tuoi progressi."},"Selim ergonômico profissional":{"en":"Professional ergonomic saddle","it":"Sella ergonomica professionale"},"Todos os modelos são equipados com o selim projetado e fabricado pela SellaItalia. Pedale com a versão preta ou personalize seu selim com um modelo de couro 100% feito na Itália, disponível em diferentes cores.":{"en":"All models are equipped with the saddle designed and manufactured by SellaItalia. Ride with the black version or personalize your saddle with a 100% made in Italy leather model, available in different colors.","it":"Tutti i modelli sono dotati della sella progettata e prodotta da SellaItalia. Pedala con la versione nera o personalizza la tua sella con un modello in pelle 100% made in Italy, disponibile in diversi colori."},"Sistema de resistência eletromagnética":{"en":"Electromagnetic resistance system","it":"Sistema di resistenza elettromagnetica"},"Uma tecnologia de ponta e um sistema exclusivo de transmissão com multiplicador de giro para alcançar o seu máximo esforço e transformar cada treino em um desafio pessoal.":{"en":"Cutting-edge technology and an exclusive transmission system with a rotation multiplier to reach your maximum effort and turn every workout into a personal challenge.","it":"Una tecnologia d'avanguardia e un sistema esclusivo di trasmissione con moltiplicatore di giri per raggiungere il tuo massimo sforzo e trasformare ogni allenamento in una sfida personale."},"A exclusiva Ciclotte Teckell nasce da colaboração entre duas excelências da indústria italiana, unidas pela paixão pela tecnologia, pela atenção aos detalhes e pelo desejo de romper os padrões no design fitness. Um modelo criado com linhas simples e leves, que se destacam sem limites.":{"en":"The exclusive Ciclotte Teckell is born from the collaboration between two excellences of Italian industry, united by a passion for technology, attention to detail and the desire to break the standards of fitness design. A model created with simple, light lines that stand out without limits.","it":"L'esclusiva Ciclotte Teckell nasce dalla collaborazione tra due eccellenze dell'industria italiana, unite dalla passione per la tecnologia, dall'attenzione ai dettagli e dal desiderio di rompere gli schemi del design fitness. Un modello creato con linee semplici e leggere, che si distinguono senza limiti."},"A coragem de ir além dos limites":{"en":"The courage to go beyond limits","it":"Il coraggio di andare oltre i limiti"},"Esta bicicleta revolucionária foi desenvolvida com base em um estudo ergonômico preciso e construída com uma transmissão eletromagnética com multiplicador de revolução, permitindo um desempenho de treino excepcional. A pureza do círculo, a tecnologia inovadora e o dinamismo silencioso de um objeto de fitness para o lar.":{"en":"This revolutionary bike was developed on the basis of a precise ergonomic study and built with an electromagnetic transmission with a revolution multiplier, enabling exceptional training performance. The purity of the circle, innovative technology and the silent dynamism of a fitness object for the home.","it":"Questa bicicletta rivoluzionaria è stata sviluppata sulla base di un preciso studio ergonomico e costruita con una trasmissione elettromagnetica con moltiplicatore di giri, che consente prestazioni di allenamento eccezionali. La purezza del cerchio, la tecnologia innovativa e il dinamismo silenzioso di un oggetto fitness per la casa."},"Eternamente clássico, eternamente icônico":{"en":"Eternally classic, eternally iconic","it":"Eternamente classica, eternamente iconica"},"Ousar sonhar o impossível":{"en":"Dare to dream the impossible","it":"Osare sognare l'impossibile"},"A Ciclotte Teckell é o resultado de uma colaboração que simboliza a audácia de utilizar materiais únicos para criar objetos refinados e minimalistas, a coragem de construir desafiando o tempo e a visão de moldar um ícone de estilo que se adapta perfeitamente aos seus espaços e ao seu ambiente.\nEsta é a primeira bicicleta ergométrica de vidro, onde a transparência cria uma estrutura quase invisível, conectando harmoniosamente as partes mecânicas e estruturais.":{"en":"Ciclotte Teckell is the result of a collaboration that symbolizes the audacity of using unique materials to create refined, minimalist objects, the courage to build in defiance of time and the vision to shape a style icon that adapts perfectly to your spaces and environment.\nThis is the first glass exercise bike, where transparency creates an almost invisible structure, harmoniously connecting the mechanical and structural parts.","it":"Ciclotte Teckell è il risultato di una collaborazione che simboleggia l'audacia di utilizzare materiali unici per creare oggetti raffinati e minimalisti, il coraggio di costruire sfidando il tempo e la visione di plasmare un'icona di stile che si adatta perfettamente ai tuoi spazi e al tuo ambiente.\nÈ la prima bicicletta da camera in vetro, dove la trasparenza crea una struttura quasi invisibile, collegando armoniosamente le parti meccaniche e strutturali."},"86 kg / 190 libras":{"en":"86 kg / 190 lb","it":"86 kg / 190 libbre"},"104 cm x 104 cm x 48 cm / 41 pol. x 41 pol. x 19 pol.":{"en":"104 cm x 104 cm x 48 cm / 41 in x 41 in x 19 in","it":"104 cm x 104 cm x 48 cm / 41 x 41 x 19 pollici"},"preto, brilhante.":{"en":"black, glossy.","it":"nero, lucido."},"Design e tecnologia para proporcionar a melhor experiência com a sua Ciclotte. Cada detalhe foi pensado para unir funcionalidade e sofisticação, tornando seus treinos ainda mais imersivos.":{"en":"Design and technology to provide the best experience with your Ciclotte. Every detail was designed to unite functionality and sophistication, making your workouts even more immersive.","it":"Design e tecnologia per offrire la migliore esperienza con la tua Ciclotte. Ogni dettaglio è stato pensato per unire funzionalità e raffinatezza, rendendo i tuoi allenamenti ancora più immersivi."},"Todos os modelos são equipados com um selim projetado e fabricado pela renomada Sella Italia. Escolha a versão preta ou personalize o seu assento com um modelo em couro 100% feito na Itália, disponível em diversas cores.":{"en":"All models are equipped with a saddle designed and manufactured by the renowned Sella Italia. Choose the black version or personalize your seat with a 100% made in Italy leather model, available in several colors.","it":"Tutti i modelli sono dotati di una sella progettata e prodotta dalla rinomata Sella Italia. Scegli la versione nera o personalizza la tua seduta con un modello in pelle 100% made in Italy, disponibile in diversi colori."},"Com tecnologia de ponta e um sistema exclusivo de transmissão com multiplicador de rotação, a Ciclotte permite alcançar seu máximo desempenho, transformando cada treino em um verdadeiro desafio pessoal.":{"en":"With cutting-edge technology and an exclusive transmission system with a rotation multiplier, Ciclotte lets you reach your maximum performance, turning every workout into a true personal challenge.","it":"Con una tecnologia d'avanguardia e un sistema esclusivo di trasmissione con moltiplicatore di giri, Ciclotte ti permette di raggiungere le massime prestazioni, trasformando ogni allenamento in una vera sfida personale."},"Uma experiência que encanta os sentidos, do visual ao movimento.":{"en":"An experience that delights the senses, from sight to movement.","it":"Un'esperienza che incanta i sensi, dalla vista al movimento."},"A Ciclotte Marble":{"en":"Ciclotte Marble","it":"Ciclotte Marble"},"A Ciclotte Marble é a única bicicleta ergométrica composta por um disco de mármore em camadas. O Mármore Verde dos Alpes, o Branco de Carrara, o Travertino Clássico Amarelo, o Travertino Vermelho e o Preto Portoro: materiais exclusivos, cuidadosamente selecionados para combinar com aqueles dos monumentos históricos mais famosos da Itália, desde o Davi e a Pietà de Michelangelo até o icônico Coliseu Romano e a cúpula da catedral de Florença.":{"en":"Ciclotte Marble is the only exercise bike made with a layered marble disc. Alpine Green Marble, Carrara White, Classic Yellow Travertine, Red Travertine and Portoro Black: exclusive materials, carefully selected to match those of Italy's most famous historical monuments, from Michelangelo's David and Pietà to the iconic Roman Colosseum and the dome of Florence Cathedral.","it":"Ciclotte Marble è l'unica bicicletta da camera composta da un disco di marmo stratificato. Il Marmo Verde delle Alpi, il Bianco di Carrara, il Travertino Classico Giallo, il Travertino Rosso e il Nero Portoro: materiali esclusivi, accuratamente selezionati per richiamare quelli dei monumenti storici più famosi d'Italia, dal David e dalla Pietà di Michelangelo all'iconico Colosseo romano e alla cupola del Duomo di Firenze."},"Estilo clássico, ideia moderna de viver":{"en":"Classic style, a modern idea of living","it":"Stile classico, idea moderna dell'abitare"},"Onde o fitness encontra a história da arte italiana":{"en":"Where fitness meets the history of Italian art","it":"Dove il fitness incontra la storia dell'arte italiana"},"Nascido no coração do território italiano para estabelecer novos padrões no mundo fitness, o disco circular de mármore é trabalhado com tecnologias de ponta para se tornar suave ao toque e perfeito em sua forma. O mármore reluzente atua como um elo contínuo, unindo os diversos componentes da bicicleta em uma exibição de coesão elegante.":{"en":"Born in the heart of Italian territory to set new standards in the fitness world, the circular marble disc is worked with cutting-edge technologies to become smooth to the touch and perfect in form. The gleaming marble acts as a continuous link, uniting the bike's various components in a display of elegant cohesion.","it":"Nato nel cuore del territorio italiano per stabilire nuovi standard nel mondo del fitness, il disco circolare in marmo è lavorato con tecnologie d'avanguardia per diventare liscio al tatto e perfetto nella forma. Il marmo lucente agisce come un legame continuo, unendo i diversi componenti della bicicletta in una dimostrazione di elegante coesione."},"88 kg / 190 lbs":{"en":"88 kg / 190 lb","it":"88 kg / 190 libbre"},"Dimensões":{"en":"Dimensions","it":"Dimensioni"},"104 x 104 x 48 cm / 41 x 41 x 19 pol.":{"en":"104 x 104 x 48 cm / 41 x 41 x 19 in","it":"104 x 104 x 48 cm / 41 x 41 x 19 pollici"},"branco, vermelho, verde, amarelo, preto":{"en":"white, red, green, yellow, black","it":"bianco, rosso, verde, giallo, nero"},"Detalhes que extraem performance da elegância":{"en":"Details that draw performance from elegance","it":"Dettagli che traggono prestazioni dall'eleganza"},"A Ciclotte DTales":{"en":"Ciclotte DTales","it":"Ciclotte DTales"},"A Ciclotte DTales é a bicicleta ergométrica de design luxuoso criada com acabamentos em madeira e detalhes que combinam com o parquet e os móveis de qualquer projeto de design de interiores, oferecendo uma sensação simples e autêntica, criando uma atmosfera tranquila e transmitindo a energia do treino em casa.":{"en":"Ciclotte DTales is the luxury design exercise bike created with wooden finishes and details that match the parquet and furniture of any interior design project, offering a simple and authentic feel, creating a calm atmosphere and conveying the energy of training at home.","it":"Ciclotte DTales è la bicicletta da camera dal design lussuoso, creata con finiture in legno e dettagli che si abbinano al parquet e agli arredi di qualsiasi progetto d'interni, offrendo una sensazione semplice e autentica, creando un'atmosfera tranquilla e trasmettendo l'energia dell'allenamento a casa."},"Nascida da terra, moldada pelas mãos humanas":{"en":"Born from the earth, shaped by human hands","it":"Nata dalla terra, plasmata da mani umane"},"Todos os modelos da série Ciclotte DTales são produzidos inteiramente na Itália, unindo o know-how dos artesãos italianos com tecnologias utilizadas na indústria da aviação. Para uma personalização absoluta, é possível combinar uma seleção de 50 cores e tipos diferentes de madeiras com acabamento em poro aberto com incrustações em madrepérola e fibra de carbono fosca — tudo isso em uma estrutura que transmite a sensação de movimento perpétuo.":{"en":"All models in the Ciclotte DTales series are produced entirely in Italy, combining the know-how of Italian artisans with technologies used in the aviation industry. For absolute personalization, a selection of 50 colors and types of open-pore wood can be combined with mother-of-pearl inlays and matte carbon fiber — all in a structure that conveys a sense of perpetual motion.","it":"Tutti i modelli della serie Ciclotte DTales sono prodotti interamente in Italia, unendo il know-how degli artigiani italiani a tecnologie utilizzate nell'industria aeronautica. Per una personalizzazione assoluta, è possibile combinare una selezione di 50 colori e tipi di legno a poro aperto con intarsi in madreperla e fibra di carbonio opaca — il tutto in una struttura che trasmette la sensazione di un movimento perpetuo."},"Projetada para a beleza, construída para a performance":{"en":"Designed for beauty, built for performance","it":"Progettata per la bellezza, costruita per le prestazioni"},"A série Ciclotte nasceu em uma oficina artesanal.":{"en":"The Ciclotte series was born in an artisan workshop.","it":"La serie Ciclotte è nata in una bottega artigiana."},"Todos os modelos da série Ciclotte DTales são fabricados inteiramente na Itália, unindo o know-how dos artesãos italianos com tecnologias empregadas no mundo da aviação. Para uma personalização máxima, é possível combinar uma variedade de 50 cores e tipos de madeiras com acabamento em poro aberto com incrustações em madrepérola e fibra de carbono fosca — tudo isso em uma estrutura que parece estar em movimento perpétuo.":{"en":"All models in the Ciclotte DTales series are manufactured entirely in Italy, combining the know-how of Italian artisans with technologies used in the world of aviation. For maximum personalization, a variety of 50 colors and types of open-pore wood can be combined with mother-of-pearl inlays and matte carbon fiber — all in a structure that seems to be in perpetual motion.","it":"Tutti i modelli della serie Ciclotte DTales sono fabbricati interamente in Italia, unendo il know-how degli artigiani italiani a tecnologie impiegate nel mondo dell'aviazione. Per la massima personalizzazione, è possibile combinare una varietà di 50 colori e tipi di legno a poro aperto con intarsi in madreperla e fibra di carbonio opaca — il tutto in una struttura che sembra in movimento perpetuo."},"55 kg / 121,3 lbs":{"en":"55 kg / 121.3 lb","it":"55 kg / 121,3 libbre"},"111 cm x 111 cm x 48 cm / 43,7 pol. x 43,7 pol. x 19 pol.":{"en":"111 cm x 111 cm x 48 cm / 43.7 in x 43.7 in x 19 in","it":"111 cm x 111 cm x 48 cm / 43,7 x 43,7 x 19 pollici"},"freixo cinza, ébano, nogueira":{"en":"gray ash, ebony, walnut","it":"frassino grigio, ebano, noce"},"A importância de cada detalhe":{"en":"The importance of every detail","it":"L'importanza di ogni dettaglio"},"Ciclotte Pirelli é a linha criada a partir da colaboração com a marca mais famosa do mundo dos pneus para o automobilismo. Uma paixão em comum pelo design, uma vocação esportiva genuína e uma devoção incondicional à qualidade e ao desempenho deram origem a um equipamento de treino único — pensado para quem gosta de se desafiar e coloca a performance em primeiro lugar.":{"en":"Ciclotte Pirelli is the line created from the collaboration with the most famous tire brand in motorsport. A shared passion for design, a genuine sporting vocation and an unconditional devotion to quality and performance gave rise to a unique piece of training equipment — designed for those who like to challenge themselves and put performance first.","it":"Ciclotte Pirelli è la linea nata dalla collaborazione con il marchio di pneumatici più famoso del motorsport. Una passione comune per il design, una genuina vocazione sportiva e una devozione incondizionata alla qualità e alle prestazioni hanno dato vita a un attrezzo di allenamento unico — pensato per chi ama mettersi alla prova e mette le prestazioni al primo posto."},"A criação de quem entende de ícones":{"en":"Created by those who understand icons","it":"La creazione di chi conosce le icone"},"Os modelos da edição limitada Ciclotte PIRELLI recebem suas cores dos pneus oficiais da mais famosa competição automobilística: macio (vermelho), intermediário (amarelo), duro (branco), chuva (verde) e molhado (azul). Viajar em alta velocidade sem sair do lugar e competir contra nós mesmos, volta após volta, curva após curva: essa é a alma de uma corrida de carros, essa é a alma da Ciclotte PIRELLI.":{"en":"The models of the Ciclotte PIRELLI limited edition take their colors from the official tires of the most famous motor racing competition: soft (red), intermediate (yellow), hard (white), rain (green) and wet (blue). Traveling at high speed without leaving your place and competing against ourselves, lap after lap, corner after corner: this is the soul of a car race, this is the soul of Ciclotte PIRELLI.","it":"I modelli in edizione limitata Ciclotte PIRELLI prendono i loro colori dagli pneumatici ufficiali della più famosa competizione automobilistica: morbido (rosso), intermedio (giallo), duro (bianco), pioggia (verde) e bagnato (blu). Viaggiare ad alta velocità senza muoversi e gareggiare contro noi stessi, giro dopo giro, curva dopo curva: questa è l'anima di una corsa automobilistica, questa è l'anima di Ciclotte PIRELLI."},"A estrutura de alta tecnologia em fibra de carbono e aço se une à inovadora resistência eletromagnética com transmissão multiplicadora de rotação e às exclusivas manoplas em borracha com o logo da Pirelli em toda a superfície, criando uma bicicleta ergométrica esportiva e refinada.\nComplete sua experiência com o kit de halteres e combine-o com o grafismo e as cores da PIRELLI, além do formato inconfundível da sua bike. Um complemento elegante para superar seus recordes pessoais.":{"en":"The high-tech carbon fiber and steel frame joins the innovative electromagnetic resistance with rotation-multiplying transmission and the exclusive rubber grips with the Pirelli logo across the whole surface, creating a sporty and refined exercise bike.\nComplete your experience with the dumbbell kit and match it with PIRELLI's graphics and colors, as well as your bike's unmistakable shape. An elegant complement to beat your personal records.","it":"Il telaio high-tech in fibra di carbonio e acciaio si unisce all'innovativa resistenza elettromagnetica con trasmissione a moltiplicatore di giri e alle esclusive manopole in gomma con il logo Pirelli su tutta la superficie, creando una bicicletta da camera sportiva e raffinata.\nCompleta la tua esperienza con il kit di manubri e abbinalo alla grafica e ai colori PIRELLI, oltre che alla forma inconfondibile della tua bici. Un complemento elegante per superare i tuoi record personali."},"Licenciado pela Multidesign – Licenciada oficial das marcas registradas da Pirelli & C. S.p.A.":{"en":"Licensed by Multidesign – Official licensee of the trademarks of Pirelli & C. S.p.A.","it":"Concesso in licenza da Multidesign – Licenziataria ufficiale dei marchi registrati di Pirelli & C. S.p.A."},"55 kg":{"en":"55 kg","it":"55 kg"},"111 x 111 x 48 cm":{"en":"111 x 111 x 48 cm","it":"111 x 111 x 48 cm"},"Cores disponíveis":{"en":"Available colors","it":"Colori disponibili"},"Amarelo, Vermelho, Branco, Verde, Azul":{"en":"Yellow, Red, White, Green, Blue","it":"Giallo, Rosso, Bianco, Verde, Blu"},"Vocação esportiva, qualidade incomparável":{"en":"Sporting vocation, incomparable quality","it":"Vocazione sportiva, qualità impareggiabile"},"Menos é mais: nasce um novo ícone do design.":{"en":"Less is more: a new design icon is born.","it":"Meno è più: nasce una nuova icona del design."},"Um verdadeiro ícone do design mundial, em sua essência. A Ciclotte liberta suas formas, redescobre o poder elegante das linhas puras e encontra inspiração nos materiais do design nórdico para apresentar a nova linha Essential.\nDetalhes ergonômicos, estrutura em aço, tela LED intuitiva e transmissão eletromagnética inovadora: por meio da fusão do design icônico da Ciclotte com o know-how de fabricação da NOHRD, foram lançados 3 novos modelos — prontos para revolucionar o conceito de treino.":{"en":"A true icon of world design, in its essence. Ciclotte frees its forms, rediscovers the elegant power of pure lines and finds inspiration in the materials of Nordic design to present the new Essential line.\nErgonomic details, steel frame, intuitive LED screen and innovative electromagnetic transmission: through the fusion of Ciclotte's iconic design with NOHRD's manufacturing know-how, 3 new models were launched — ready to revolutionize the concept of training.","it":"Una vera icona del design mondiale, nella sua essenza. Ciclotte libera le sue forme, riscopre la potenza elegante delle linee pure e trova ispirazione nei materiali del design nordico per presentare la nuova linea Essential.\nDettagli ergonomici, telaio in acciaio, schermo LED intuitivo e innovativa trasmissione elettromagnetica: dalla fusione del design iconico di Ciclotte con il know-how produttivo di NOHRD sono nati 3 nuovi modelli — pronti a rivoluzionare il concetto di allenamento."},"Outros ícones de design da coleção Essential":{"en":"Other design icons from the Essential collection","it":"Altre icone di design della collezione Essential"},"A Ciclotte One":{"en":"Ciclotte One","it":"Ciclotte One"},"A nova Ciclotte One nasceu da busca por um design essencial e limpo. Um modelo revolucionário, produzido em colaboração com a NOHRD™. A partir da icônica forma circular da Ciclotte, surge a nova coleção Essential, que vai direto ao coração do design, ao coração da performance, ao coração dos esportistas.":{"en":"The new Ciclotte One was born from the search for an essential, clean design. A revolutionary model, produced in collaboration with NOHRD™. From Ciclotte's iconic circular shape comes the new Essential collection, which goes straight to the heart of design, to the heart of performance, to the heart of athletes.","it":"La nuova Ciclotte One nasce dalla ricerca di un design essenziale e pulito. Un modello rivoluzionario, prodotto in collaborazione con NOHRD™. Dall'iconica forma circolare di Ciclotte nasce la nuova collezione Essential, che va dritta al cuore del design, al cuore delle prestazioni, al cuore degli sportivi."},"Tão límpido quanto o ar do norte.":{"en":"As clear as the northern air.","it":"Limpida come l'aria del nord."},"A estrutura feita por um único tubo de aço curvado, os componentes eletrônicos inovadores e um selim de design limpo. Tudo é reduzido à essência, para moldar um objeto tão claro quanto o ar do norte da Europa, com a nova tela de LED e a conectividade via Nohrd Connect App, Zwift ou Kinomap.":{"en":"The frame made from a single curved steel tube, the innovative electronic components and a clean-design saddle. Everything is reduced to its essence, to shape an object as clear as the air of northern Europe, with the new LED screen and connectivity via the Nohrd Connect App, Zwift or Kinomap.","it":"Il telaio realizzato con un unico tubo d'acciaio curvato, i componenti elettronici innovativi e una sella dal design pulito. Tutto è ridotto all'essenza, per plasmare un oggetto chiaro come l'aria del nord Europa, con il nuovo schermo LED e la connettività tramite l'app Nohrd Connect, Zwift o Kinomap."},"O impacto de uma geometria simples":{"en":"The impact of a simple geometry","it":"L'impatto di una geometria semplice"},"A simplicidade de uma linha, as influências do design nórdico e formas precisas que revelam a marca da confiança.":{"en":"The simplicity of a line, the influences of Nordic design and precise forms that reveal the mark of confidence.","it":"La semplicità di una linea, le influenze del design nordico e forme precise che rivelano il segno della fiducia."},"Materiais incomparáveis":{"en":"Incomparable materials","it":"Materiali incomparabili"},"60 kg / 132,3 libras":{"en":"60 kg / 132.3 lb","it":"60 kg / 132,3 libbre"},"104 x 104 x 48 cm / 41 x 41 x 19 polegadas":{"en":"104 x 104 x 48 cm / 41 x 41 x 19 inches","it":"104 x 104 x 48 cm / 41 x 41 x 19 pollici"},"preto":{"en":"black","it":"nero"},"Outros modelos da coleção Essential":{"en":"Other models from the Essential collection","it":"Altri modelli della collezione Essential"},"Viva a essência do esporte":{"en":"Live the essence of sport","it":"Vivi l'essenza dello sport"},"A Ciclotte One Pirelli":{"en":"Ciclotte One Pirelli","it":"Ciclotte One Pirelli"},"A sensação de estar na pole position, a adrenalina antes da largada, a paixão pela velocidade e a determinação para resistir. A nova Ciclotte One Pirelli nasceu da pura paixão por performance e design, para se tornar um novo marco no universo do fitness doméstico.":{"en":"The feeling of being in pole position, the adrenaline before the start, the passion for speed and the determination to hold on. The new Ciclotte One Pirelli was born from a pure passion for performance and design, to become a new landmark in the world of home fitness.","it":"La sensazione di essere in pole position, l'adrenalina prima della partenza, la passione per la velocità e la determinazione a resistere. La nuova Ciclotte One Pirelli nasce dalla pura passione per le prestazioni e il design, per diventare un nuovo punto di riferimento nel mondo del fitness domestico."},"Uma corrida é mais do que uma vitória":{"en":"A race is more than a victory","it":"Una corsa è più di una vittoria"},"As cores únicas dos pneus de corrida, a potência da nova transmissão desenvolvida com a NOHRD™, a pegada dos exclusivos manetes de borracha e a usabilidade da nova tela LED — tudo para você encarar a pista como um verdadeiro número um. Alimente sua paixão conectando sua Ciclotte One Pirelli pelos aplicativos Nohrd Connect, Zwift ou Kinomap.":{"en":"The unique colors of racing tires, the power of the new transmission developed with NOHRD™, the grip of the exclusive rubber handles and the usability of the new LED screen — all so you can take on the track like a true number one. Fuel your passion by connecting your Ciclotte One Pirelli through the Nohrd Connect, Zwift or Kinomap apps.","it":"I colori unici degli pneumatici da corsa, la potenza della nuova trasmissione sviluppata con NOHRD™, la presa delle esclusive manopole in gomma e l'usabilità del nuovo schermo LED — tutto per affrontare la pista come un vero numero uno. Alimenta la tua passione collegando la tua Ciclotte One Pirelli tramite le app Nohrd Connect, Zwift o Kinomap."},"O coração de um campeão":{"en":"The heart of a champion","it":"Il cuore di un campione"},"Viajamos até o coração do esporte para oferecer aos fãs um objeto único. Um quadro construído a partir de uma única peça de aço, renovando o formato icônico da Ciclotte e transformando cada treino em uma verdadeira corrida. Equilíbrio, determinação e paixão para encarar a pista como um verdadeiro número um.":{"en":"We traveled to the heart of sport to offer fans a unique object. A frame built from a single piece of steel, renewing Ciclotte's iconic shape and turning every workout into a true race. Balance, determination and passion to take on the track like a true number one.","it":"Abbiamo viaggiato fino al cuore dello sport per offrire agli appassionati un oggetto unico. Un telaio costruito a partire da un unico pezzo d'acciaio, che rinnova l'iconica forma di Ciclotte e trasforma ogni allenamento in una vera gara. Equilibrio, determinazione e passione per affrontare la pista come un vero numero uno."},"A essência do esporte.":{"en":"The essence of sport.","it":"L'essenza dello sport."},"A Multidesign é licenciada para o uso das marcas registradas pertencentes à Pirelli & C. S.p.A, para a Ciclotte.":{"en":"Multidesign is licensed to use the trademarks belonging to Pirelli & C. S.p.A, for Ciclotte.","it":"Multidesign è licenziataria per l'uso dei marchi registrati appartenenti a Pirelli & C. S.p.A, per Ciclotte."},"60 kg / 132,3 lbs":{"en":"60 kg / 132.3 lb","it":"60 kg / 132,3 libbre"},"preto, vermelho, amarelo, branco, verde, azul":{"en":"black, red, yellow, white, green, blue","it":"nero, rosso, giallo, bianco, verde, blu"},"A Ciclotte Nohrd":{"en":"Ciclotte Nohrd","it":"Ciclotte Nohrd"},"Um modelo que equilibra forma e função, alma italiana e pragmatismo alemão, materiais clássicos e de alta tecnologia. Da experiência alemã e do bom gosto italiano nasce a nova Nohrd Ciclotte, a bicicleta ergométrica da coleção Essential, com seus detalhes refinados originários das florestas do norte.":{"en":"A model that balances form and function, Italian soul and German pragmatism, classic and high-tech materials. From German experience and Italian good taste comes the new Nohrd Ciclotte, the exercise bike of the Essential collection, with refined details originating from the northern forests.","it":"Un modello che bilancia forma e funzione, anima italiana e pragmatismo tedesco, materiali classici e ad alta tecnologia. Dall'esperienza tedesca e dal buon gusto italiano nasce la nuova Nohrd Ciclotte, la bicicletta da camera della collezione Essential, con dettagli raffinati provenienti dalle foreste del nord."},"Correndo por você mesmo":{"en":"Racing for yourself","it":"Correre per se stessi"},"O poder da nova transmissão desenvolvida com a NOHRD™, o estudo ergonômico e a usabilidade da nova tela LED para redescobrir a verdadeira paixão pelo esporte e pelo treino.\nViva uma experiência de treino imersiva, desafie seus amigos ou supere seus próprios limites conectando sua Ciclotte Nohrd pelos aplicativos Nohrd Connect, Zwift ou Kinomap.":{"en":"The power of the new transmission developed with NOHRD™, the ergonomic study and the usability of the new LED screen to rediscover the true passion for sport and training.\nLive an immersive training experience, challenge your friends or push your own limits by connecting your Ciclotte Nohrd through the Nohrd Connect, Zwift or Kinomap apps.","it":"La potenza della nuova trasmissione sviluppata con NOHRD™, lo studio ergonomico e l'usabilità del nuovo schermo LED per riscoprire la vera passione per lo sport e l'allenamento.\nVivi un'esperienza di allenamento immersiva, sfida i tuoi amici o supera i tuoi limiti collegando la tua Ciclotte Nohrd tramite le app Nohrd Connect, Zwift o Kinomap."},"Potência":{"en":"Power","it":"Potenza"},"A força de uma floresta":{"en":"The strength of a forest","it":"La forza di una foresta"},"A essência do esporte encontra a essência da floresta para dar vida a 6 versões diferentes da nova Ciclotte Nohrd. Carvalho, faia, cerejeira e nogueira, em diferentes variações de cor, personalizam a caixa de marchas e conferem ao seu lar a elegância natural da madeira":{"en":"The essence of sport meets the essence of the forest to bring 6 different versions of the new Ciclotte Nohrd to life. Oak, beech, cherry and walnut, in different color variations, personalize the gearbox and bring the natural elegance of wood into your home","it":"L'essenza dello sport incontra l'essenza della foresta per dare vita a 6 diverse versioni della nuova Ciclotte Nohrd. Rovere, faggio, ciliegio e noce, in diverse varianti di colore, personalizzano la scatola del cambio e portano nella tua casa l'eleganza naturale del legno"},"Estilo italiano. Engenharia alemã":{"en":"Italian style. German engineering","it":"Stile italiano. Ingegneria tedesca"},"75 kg / 50 lbs":{"en":"75 kg / 50 lb","it":"75 kg / 50 libbre"},"33 x 25 cm / 39 x 45 polegadas":{"en":"33 x 25 cm / 39 x 45 inches","it":"33 x 25 cm / 39 x 45 pollici"},"preto com acabamentos em madeira":{"en":"black with wood finishes","it":"nero con finiture in legno"},"Pesos Modulares. Design Circular Icônico.":{"en":"Modular Weights. Iconic Circular Design.","it":"Pesi Modulari. Design Circolare Iconico."},"Os halteres Ciclotte são um conjunto modular de pesos de design, criados para oferecer desempenho e elegância no verdadeiro estilo Ciclotte. Vencedores do prestigiado International Design Award (IDA), os halteres contam com um sistema de encaixe inovador que permite trocar rapidamente e com facilidade entre três níveis de peso — de 1,5 kg a 7 kg.\nInspirados na silhueta circular icônica da Ciclotte, esses halteres equilibram perfeitamente a estética escultural com a performance funcional. Seja como peça decorativa de destaque ou como ferramenta para treinos intensos, são uma adição sofisticada a qualquer ambiente.":{"en":"Ciclotte dumbbells are a modular set of design weights, created to offer performance and elegance in true Ciclotte style. Winners of the prestigious International Design Award (IDA), the dumbbells feature an innovative coupling system that allows quick and easy switching between three weight levels — from 1.5 kg to 7 kg.\nInspired by Ciclotte's iconic circular silhouette, these dumbbells perfectly balance sculptural aesthetics with functional performance. Whether as a standout decorative piece or a tool for intense workouts, they are a sophisticated addition to any space.","it":"I manubri Ciclotte sono un set modulare di pesi di design, creati per offrire prestazioni ed eleganza nel vero stile Ciclotte. Vincitori del prestigioso International Design Award (IDA), i manubri dispongono di un innovativo sistema a incastro che permette di passare rapidamente e facilmente tra tre livelli di peso — da 1,5 kg a 7 kg.\nIspirati all'iconica silhouette circolare di Ciclotte, questi manubri bilanciano perfettamente estetica scultorea e prestazioni funzionali. Che sia come pezzo decorativo di spicco o come strumento per allenamenti intensi, sono un'aggiunta raffinata a qualsiasi ambiente."},"Fruto da colaboração com a marca mais famosa do mundo do automobilismo de pneus, nasce o kit de halteres Ciclotte Pirelli, que incorpora o exclusivo sistema de encaixe da Ciclotte, três diferentes níveis de peso e a icônica forma circular.\nUm objeto de design e uma ferramenta de treino movidos pela paixão compartilhada por esporte e design. Os kits de halteres Ciclotte Pirelli têm suas cores inspiradas nos pneus oficiais da mais famosa competição automobilística: macio (vermelho), intermediário (amarelo), duro (branco), chuva (verde) e molhado (azul). Combine com sua bicicleta ergométrica Ciclotte Pirelli ou adicione um toque único ao seu ambiente de treino.\nA Multidesign é licenciada para o uso das marcas registradas da Pirelli & C. S.p.A para a Ciclotte.":{"en":"Born from the collaboration with the most famous tire brand in motorsport, the Ciclotte Pirelli dumbbell kit incorporates Ciclotte's exclusive coupling system, three different weight levels and the iconic circular shape.\nA design object and a training tool driven by a shared passion for sport and design. The Ciclotte Pirelli dumbbell kits take their colors from the official tires of the most famous motor racing competition: soft (red), intermediate (yellow), hard (white), rain (green) and wet (blue). Pair it with your Ciclotte Pirelli exercise bike or add a unique touch to your training space.\nMultidesign is licensed to use the trademarks of Pirelli & C. S.p.A for Ciclotte.","it":"Frutto della collaborazione con il marchio di pneumatici più famoso del motorsport, nasce il kit di manubri Ciclotte Pirelli, che incorpora l'esclusivo sistema a incastro di Ciclotte, tre diversi livelli di peso e l'iconica forma circolare.\nUn oggetto di design e uno strumento di allenamento animati dalla passione condivisa per lo sport e il design. I kit di manubri Ciclotte Pirelli prendono i loro colori dagli pneumatici ufficiali della più famosa competizione automobilistica: morbido (rosso), intermedio (giallo), duro (bianco), pioggia (verde) e bagnato (blu). Abbinalo alla tua bicicletta da camera Ciclotte Pirelli o aggiungi un tocco unico al tuo spazio di allenamento.\nMultidesign è licenziataria per l'uso dei marchi registrati di Pirelli & C. S.p.A per Ciclotte."},"Personalize seu treinamento":{"en":"Personalize your training","it":"Personalizza il tuo allenamento"},"Mostrando todos os 3 resultados":{"en":"Showing all 3 results","it":"Visualizzazione di tutti i 3 risultati"},"Mostrando todos os 2 resultados":{"en":"Showing all 2 results","it":"Visualizzazione di tutti i 2 risultati"},"Mostrando todos os 5 resultados":{"en":"Showing all 5 results","it":"Visualizzazione di tutti i 5 risultati"},"Exibindo 1–16 de 17 resultados":{"en":"Showing 1–16 of 17 results","it":"Visualizzazione di 1–16 su 17 risultati"},"Exibindo 1–16 de 61 resultados":{"en":"Showing 1–16 of 61 results","it":"Visualizzazione di 1–16 su 61 risultati"},"Exibindo 1–16 de 71 resultados":{"en":"Showing 1–16 of 71 results","it":"Visualizzazione di 1–16 su 71 risultati"},"Exibindo 1–16 de 55 resultados":{"en":"Showing 1–16 of 55 results","it":"Visualizzazione di 1–16 su 55 risultati"},"Exibindo 1–16 de 96 resultados":{"en":"Showing 1–16 of 96 results","it":"Visualizzazione di 1–16 su 96 risultati"},"Exibindo 1–16 de 47 resultados":{"en":"Showing 1–16 of 47 results","it":"Visualizzazione di 1–16 su 47 risultati"}}</script>

function product(k){
  const B=C[k]; if(!B) return V.inicio(); const cat=CATD[k];
  let i=0; const out=[];
  // capa: primeiro fundo, título, subtítulo, texto e botão
  const hero=B[i++]; const h1=B[i++]; let sub=null, lead=[], cta=null;
  while(i<B.length && ['h2','h3'].includes(B[i].t) && !sub){ sub=B[i++]; }
  while(i<B.length && B[i].t==='p' && lead.length<1){ lead.push(B[i++]); }
  if(B[i]&&B[i].t==='a'){ cta=B[i++]; }
  const crumbBrand = cat[2]==='cardio'||cat[2]==='forca' ? ['#panatta','Panatta'] : ['#ciclotte','Ciclotte'];
  const crumbLine = {cardio:'Cardio',forca:u('ui.forca'),bespoke:'Bespoke Collection',essential:'Essential Collection',equip:u('grp.equip').split(', ')[1]}[cat[2]];
  out.push(`<section class="wrap capa"><div class="tt"><div class="crumb fade"><a href="${crumbBrand[0]}">${crumbBrand[1]}</a><span>/</span><span>${esc(crumbLine)}</span></div><h1>${lines(h1.x)}</h1>${sub?`<p class="sub fade">${tx(sub.x)}</p>`:''}</div>
    <div class="side fade">${lead.length?`<div class="copy">${paras(lead[0].x)}</div>`:''}${cta?A(cta):''}</div></section>
    <section class="wrap fade">${ph(hero.s,'hero-ph','data-hero')}</section>`);
  // demais blocos
  const isText=b=>b&&['h2','h3','h4','p','lead','ul','dl','txt','a','badges','cfg'].includes(b.t);
  const lastBg=(()=>{ let li=-1; B.forEach((b,j)=>{ if(b.t==='bg') li=j; }); return li; })();
  while(i<B.length){
    const b=B[i];
    // fechamento: último fundo seguido de h4 e botão, ou h4 + botão sem fundo
    if((b.t==='bg' && i===lastBg && B.slice(i+1).some(x=>x.t==='h4')) || (b.t==='h4' && B[i+1] && B[i+1].t==='a' && !B.slice(i+2).some(x=>['grid','feat','r360','rel'].includes(x.t)))){
      let bg=null; if(b.t==='bg'){ bg=b; i++; }
      const rest=[]; while(i<B.length && B[i].t!=='rel' && B[i].t!=='grid'){ rest.push(B[i]); i++; }
      const h4=rest.find(x=>x.t==='h4'), a=rest.find(x=>x.t==='a'), imgs=rest.filter(x=>x.t==='img');
      const img = bg ? bg.s : null;
      if(img) out.push(`<section class="wrap sec"><div class="close"><img src="${IM(img)}" alt="" loading="lazy"><div class="in">${h4?`<h2>${tx(h4.x)}</h2>`:''}${a?A(a,'btn light'):''}</div></div></section>`);
      else out.push(`<section class="wrap sec"><div class="cap" data-light><div class="in">${h4?`<h2 style="font-size:var(--t-l)">${tx(h4.x)}</h2>`:''}${a?A(a,'btn light'):''}</div></div></section>`);
      continue;
    }
    if(b.t==='bg'){
      // foto de seção + texto que a acompanha
      i++; const txt=[]; while(i<B.length && isText(B[i]) && B[i].t!=='h4' && !(B[i].t==='a' && txt.length===0 && false)){ txt.push(B[i]); i++; if(B[i]&&(B[i].t==='bg'||B[i].t==='grid'||B[i].t==='feat'||B[i].t==='r360'||B[i].t==='img'||B[i].t==='video')) break; }
      const r360=B[i]&&B[i].t==='r360';
      if(r360){ out.push(`<section class="wrap sec"><div class="ph band rv"><img src="${IM(b.s)}" alt="" loading="lazy"></div></section>`); if(txt.length) B.splice(i,0,...[]); i-=0; // texto volta para o bloco 360
        // empurra o texto para antes do 360
        out.push(textBlock(txt.filter(x=>!['h2','h3'].includes(x.t))));
        const head=txt.find(x=>['h2','h3'].includes(x.t)); B[i]._head=head; continue; }
      out.push(`<section class="wrap sec"><div class="ph band rv"><img src="${IM(b.s)}" alt="" loading="lazy"></div></section>`);
      if(txt.length) out.push(textBlock(txt));
      continue;
    }

      i++; const txt=[]; while(i<B.length && isText(B[i]) && B[i].t!=='h4'){ txt.push(B[i]); i++; if(B[i]&&!isText(B[i])) break; }
      const d=DIM[base(b.s)]||[1600,1000]; const png=/\.png$/i.test(b.s); const ar=d[0]/d[1];

      else out.push(`<section class="wrap sec"><figure class="fig ph ${png||d[0]<900?'studio':''}" style="${png||d[0]<900?'':'aspect-ratio:'+ar}">${png||d[0]<900?`<img src="${IM(b.s)}" alt="" loading="lazy" style="position:static;width:auto;max-width:100%;max-height:560px;margin:0 auto">`:`<img src="${IM(b.s)}" alt="" loading="lazy">`}</figure></section>`);
      continue;
    }
    if(b.t==='feat'){
      const fs=[]; while(i<B.length && B[i].t==='feat'){ fs.push(B[i]); i++; }
      const ic=fs.filter(f=>f.ic), ft=fs.filter(f=>!f.ic);
      if(ic.length) out.push(`<section class="wrap sec"><div class="icons">${ic.map(f=>`<div class="ic"><img src="${IM(f.s)}" alt=""><h4>${tx(f.h)}</h4><p>${tx(f.x)}</p></div>`).join('')}</div></section>`);
      if(ft.length) out.push(explorer(ft));
      continue;
    }
    if(b.t==='grid'){ i++; out.push(`<section class="wrap sec"><div class="models-h"><span class="small">${tx(b.n)}</span></div><div class="models">${b.items.map(([n,s])=>`<figure>${ph(s,'studio')}<figcaption>${esc(n)}</figcaption></figure>`).join('')}</div></section>`); continue; }
    if(b.t==='r360'){ i++; const txt=[]; const head=b._head; while(i<B.length && ['p','cfg','a'].includes(B[i].t)){ txt.push(B[i]); i++; }
      out.push(`<section class="wrap sec"><div class="v360"><div class="view" data-r="${b.k}">${[0,1,2].map(v=>`<i class="fr${v?'':' on'}" data-v="${v}" style="background-image:url(r360s/${b.k}-${v}.webp)"></i>`).join('')}<span class="load"></span><span class="hint"><svg><use href="#i-rot"/></svg>${u('ui.girar')}</span></div><div class="tx">${head?`<h2>${tx(head.x)}</h2>`:''}${textInner(txt)}</div></div></section>`); continue; }
    if(b.t==='video'){ i++; out.push(`<section class="wrap sec"><a class="vid" href="${b.s}" target="_blank" rel="noopener"><span class="pl"><svg><use href="#i-play"/></svg></span><span><b>${u('ui.video')}</b><br><span>${u('ui.videoS')}</span></span><span></span></a></section>`); continue; }
    if(b.t==='acc'){ i++; out.push(`<section class="wrap sec"><div class="blk"><div class="h">${b.h?`<h2>${tx(b.h)}</h2>`:''}</div><div class="b"><div class="acc">${b.items.map(([h,x],j)=>`<details${j?'':' open'}><summary>${tx(h)}<i aria-hidden="true"></i></summary><div class="copy"><p>${tx(x)}</p></div></details>`).join('')}</div></div></div></section>`); continue; }
    if(b.t==='rel'){ i++; out.push(`<section class="wrap sec">${b.h?`<div class="models-h"><h2>${tx(b.h)}</h2></div>`:''}<div class="rail">${b.items.map(([n,s,key])=>`<a href="#p-${key}" data-vt>${ph(s)}<h4>${esc(n)}</h4></a>`).join('')}</div></section>`); continue; }
    if(b.t==='quote'){ i++; out.push(`<section class="wrap sec"><div class="blk solo"><div class="b qtext">${paras(b.x)}</div></div></section>`); continue; }
    // texto solto
    const txt=[]; while(i<B.length && isText(B[i]) && !(B[i].t==='h4' && B[i+1] && B[i+1].t==='a')){ txt.push(B[i]); i++; if(B[i]&&!isText(B[i])) break; }
    if(txt.length) out.push(textBlock(txt)); else i++;
  }
  // próxima peça
  const idx=CAT.findIndex(c=>c[0]===k); const nx=CAT[(idx+1)%CAT.length];
  out.push(`<section class="wrap sec"><a class="close" href="#p-${nx[0]}" data-vt style="min-height:clamp(260px,34vh,360px)"><img src="${IM(firstBg(nx[0]))}" alt="" loading="lazy"><div class="in"><span class="small" style="color:rgba(241,238,232,.75)">${u('ui.next')}</span><h2>${esc(nx[1])}</h2></div></a></section>`);
  return out.join('');
}
function textInner(txt){
  return txt.map(b=>{
    if(b.t==='h2'||b.t==='h3') return `<h2>${tx(b.x)}</h2>`;
    if(b.t==='h4') return `<h3 style="font-size:var(--t-m)">${tx(b.x)}</h3>`;
    if(b.t==='lead') return `<p class="lead">${tx(b.x)}</p>`;
    if(b.t==='p') return `<div class="copy">${paras(b.x)}</div>`;
    if(b.t==='a') return A(b,'link');
    if(b.t==='ul') return `${b.h?`<p class="cfg-h">${tx(b.h)}</p>`:''}<ul class="list">${b.items.map(x=>`<li>${tx(x)}</li>`).join('')}</ul>`;
    if(b.t==='dl') return `<div class="wall">${b.items.map(([h,x])=>`<div class="it"><h3>${tx(h)}</h3><div class="copy"><p>${tx(x)}</p></div></div>`).join('')}</div>`;
    if(b.t==='txt') return `<div class="wall"><div class="it"><h3>${tx(b.h)}</h3><div class="copy">${paras(b.x)}</div></div></div>`;
    if(b.t==='badges') return `<div class="badges">${b.items.map(s=>`<img src="${IM(s)}" alt="" class="${/Patent/.test(s)?'wide':''}">`).join('')}</div>`;
    if(b.t==='cfg') return `<div><p class="cfg-h">${tx(b.h)}</p><dl class="cfg">${b.items.map(([a,v])=>`<dt>${tx(a)}</dt><dd>${tx(v)}</dd>`).join('')}</dl>${b.note?`<p class="cfg-n">${tx(b.note)}</p>`:''}</div>`;
    return '';
  }).join('');
}
function textBlock(txt){
  if(!txt.length) return '';
  const hi=txt.findIndex(b=>['h2','h3','h4'].includes(b.t));
  const walls=txt.every(b=>['txt','dl'].includes(b.t)||b.t==='a');

  return `<section class="wrap sec"><div class="blk solo"><div class="b">${textInner(txt)}</div></div></section>`;
}

/* ——— giro 360 com os quadros do render original (15 ângulos × 3 alturas) ——— */
function spin(el){
  const k=el.dataset.r, frs=$$('.fr',el), load=$('.load',el); const U=15,Vn=3; let uf=0,vf=0,vel=0,raf=0,drag=null,dead=false;
  let n=0; load.textContent=u('ui.carregando'); frs.forEach(f=>{ const im=new Image(); im.onload=()=>{ n++; if(n>=Vn) load.textContent=''; }; im.src=`r360s/${k}-${f.dataset.v}.webp`; });
  const show=()=>{ const uu=((Math.round(uf)%U)+U)%U, vv=Math.max(0,Math.min(Vn-1,Math.round(vf))); frs.forEach((f,j)=>{ f.classList.toggle('on',j===vv); if(j===vv) f.style.backgroundPosition=(uu/(U-1)*100)+'% 0'; }); };
  show();
  const tick=()=>{ if(dead) return; if(!drag && Math.abs(vel)>.01){ uf+=vel; vel*=.9; show(); raf=requestAnimationFrame(tick); } else raf=0; };
  el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY,uf,vf,t:performance.now(),lx:e.clientX}; vel=0; el.classList.add('used'); });
  el.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; const w=el.clientWidth; uf=drag.uf - dx/(w/U)*1.1; vf=drag.vf + dy/(el.clientHeight/(Vn*1.4)); vel=-(e.clientX-drag.lx)/(w/U)*1.1; drag.lx=e.clientX; show(); });
  const up=()=>{ if(!drag) return; drag=null; if(!reduce && !raf) raf=requestAnimationFrame(tick); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.tabIndex=0; el.setAttribute('role','img'); el.setAttribute('aria-label',u('ui.girar'));
  el.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){uf-=1;show();} if(e.key==='ArrowRight'){uf+=1;show();} if(e.key==='ArrowUp'){vf=Math.max(0,vf-1);show();} if(e.key==='ArrowDown'){vf=Math.min(Vn-1,vf+1);show();} });
  return {stop(){dead=true; cancelAnimationFrame(raf);}};
}

let FLT='all'; const applyFilter=()=>{ $$('#flt button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===FLT)); $$('.grp',lst).forEach(g=>g.hidden=!(FLT==='all'||g.dataset.g===FLT||(FLT==='cardio'&&g.dataset.g==='cardio')||(FLT==='forca'&&g.dataset.g==='forca'))); };
$$('#flt button').forEach(b=>b.onclick=()=>{ FLT=b.dataset.f; applyFilter(); const first=$('.grp:not([hidden]) .row',lst); if(first) pv(first.dataset.k); });
function openSheet(){ if(!sheet.open){ sheet.classList.remove('closing'); sheet.showModal(); } }
function closeSheet(now){ if(!sheet.open) return; if(now||reduce){ sheet.close(); return; } sheet.classList.add('closing'); setTimeout(()=>{ sheet.close(); sheet.classList.remove('closing'); },380); }
document.addEventListener('click',e=>{ if(e.target.closest('[data-open]')){ e.preventDefault(); openSheet(); } });
$('#sh-x').onclick=()=>closeSheet(); sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); }); sheet.addEventListener('cancel',e=>{ e.preventDefault(); closeSheet(); });

/* ——— rodapé, rótulos e idioma ——— */
function paintChrome(){
  $$('[data-t]').forEach(el=>el.textContent=u(el.dataset.t)); $$('[data-ta]').forEach(el=>el.setAttribute('aria-label',u(el.dataset.ta)));
  $('#theme').setAttribute('aria-label',u('ui.tema'));
  $('#f-pan').innerHTML=FOOT_PAN.map(k=>`<li><a href="#p-${k}">${esc(FOOT_PAN_N[k]||CATD[k][1])}</a></li>`).join('');
  $('#f-cic').innerHTML=FOOT_CIC.map(k=>`<li><a href="#p-${k}">${esc(k==='equipamento'?u('grp.equip').split(', ')[1]:CATD[k][1])}</a></li>`).join('');
  $('#f-reffo').innerHTML=[['inicio','Home'],['quem-somos',u('nav.quem')],['ciclotte','Ciclotte'],['panatta','Panatta'],['contato',u('nav.contato')]].map(([k,n])=>`<li><a href="#${k}">${esc(n)}</a></li>`).join('');
  $$('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  paintSheet();
}
$$('#langs button').forEach(b=>b.onclick=()=>{ if(L===b.dataset.l) return; L=b.dataset.l; store.set('reffo-lang',L); paintChrome(); const y=scrollY; render(); scrollTo(0,y); });

/* ——— tema ——— */
const root=document.documentElement;
const sysDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const isDark=()=>root.dataset.theme? root.dataset.theme==='dark' : sysDark();
const paintTheme=()=>{ $('#theme use').setAttribute('href',isDark()?'#i-sun':'#i-moon'); };
const saved=store.get('reffo-theme'); if(saved) root.dataset.theme=saved;
$('#theme').onclick=()=>{ const next=isDark()?'light':'dark'; root.dataset.theme=next; store.set('reffo-theme',next); paintTheme(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
new MutationObserver(paintTheme).observe(root,{attributes:true,attributeFilter:['data-theme']});

paintChrome(); paintTheme(); render();
})();
</script>
